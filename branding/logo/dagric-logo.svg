<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <radialGradient id="bg" cx="30%" cy="20%" r="120%">
      <stop offset="0%" stop-color="#16212e"/>
      <stop offset="100%" stop-color="#080d13"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3fa9f5"/>
      <stop offset="100%" stop-color="#7be0c8"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="52" fill="url(#bg)"/>
  <!-- D monogram: the day-ruler mark -->
  <path fill="url(#accent)" fill-rule="evenodd"
        d="M 84 64 h 44 a 64 64 0 0 1 0 128 h -44 z
           M 108 88 v 80 h 18 a 40 40 0 0 0 0 -80 z"/>
  <!-- sunrise line: dagr, the day -->
  <rect x="70" y="204" width="116" height="8" rx="4" fill="#3fa9f5" opacity="0.55"/>
</svg>
