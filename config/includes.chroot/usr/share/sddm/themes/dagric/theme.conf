[General]
; Dagric OS login theme.
;
; SDDM merges theme.conf.user over this file, so a machine can be re-pointed at
; a different backdrop without editing anything the next package update will
; overwrite. Every key here is read by Main.qml and nothing else reads them —
; there is no inherited Breeze behaviour left to be surprised by.
;
; Anything named here is opened by the greeter, which runs as the unprivileged
; `sddm` user. Every path must be world-readable and must not live under a home
; directory; that is why the art sits in /usr/share/dagric rather than beside
; the theme.

; The backdrop. Authored at 3840x2160 by branding/sddm/make-login-art.sh, which
; keeps the centre deliberately quiet because the form sits on top of it.
type=image
background=/usr/share/dagric/sddm/background.png

; Drawn before the image and left underneath it, so a missing or unreadable
; backdrop degrades to brand navy rather than to black. Same navy as the
; first-run wizard and the manual.
color=#0a111c

; The mark above the clock. showlogo is "shown" or anything else for hidden,
; matching the spelling Breeze used, because that is what anyone who has edited
; an SDDM theme before will type.
showlogo=shown
logo=/usr/share/dagric/logo/dagric-logo.png

showClock=true
