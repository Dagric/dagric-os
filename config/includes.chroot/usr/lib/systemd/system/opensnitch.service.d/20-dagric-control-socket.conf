[Unit]
# Package-owned wiring: remove with dagric-tools, not a persistent conffile.
After=systemd-tmpfiles-setup.service

[Service]
ExecStartPre=/usr/bin/systemd-tmpfiles --create /usr/lib/tmpfiles.d/dagric-opensnitch.conf
ExecStartPre=/usr/bin/opensnitch-ui --check-directory
ExecStartPre=/usr/bin/opensnitch-ui --migrate-config
ExecStart=
ExecStart=/usr/bin/opensnitchd -rules-path /etc/opensnitchd/rules -ui-socket unix:///run/dagric-opensnitch/osui.sock
