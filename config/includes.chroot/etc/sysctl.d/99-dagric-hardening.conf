# Dagric OS — kernel hardening baseline
# Sensible defaults for a desktop: harden without breaking anything.

# Hide kernel pointers and dmesg from unprivileged users
kernel.kptr_restrict = 2
kernel.dmesg_restrict = 1

# Restrict ptrace to direct children (blocks casual process snooping)
kernel.yama.ptrace_scope = 1

# Block loading kexec kernels at runtime (a classic post-exploit persistence
# and Secure-Boot-bypass vector)
kernel.kexec_load_disabled = 1

# Hide kernel perf events from unprivileged users (perf has been an exploit
# surface). 2 is the ceiling this kernel actually distinguishes, and the reason
# matters: the sysctl is registered with a plain proc_dointvec handler and no
# upper bound, so a 3 is accepted silently and systemd-sysctl logs nothing —
# but perf_allow_kernel() tests `> 1`, perf_allow_cpu() tests `> 0`,
# perf_allow_tracepoint() tests `> -1`, and nothing in mainline reads higher.
# Level 3 ("deny perf_event_open to unprivileged users outright") is Canonical's
# patch, which Debian does not carry. THIS USED TO SAY 3, which behaved exactly
# like 2 on 6.12+deb13 while reading as something stronger — a hardening line
# documenting protection the shipped kernel does not implement.
kernel.perf_event_paranoid = 2

# Harden the (e)BPF surface for unprivileged users
kernel.unprivileged_bpf_disabled = 1
net.core.bpf_jit_harden = 2

# SysRq: keep only the safe sync / remount-read-only / reboot bits.
#
# THE VALUE USED TO BE 4, WHICH IS NONE OF THOSE THREE. The kernel's bitmask
# (Documentation/admin-guide/sysrq.rst) is:
#     2 console log level    4 keyboard control (SAK, unraw)
#     8 process dumps       16 sync            32 remount read-only
#    64 signal processes   128 reboot/poweroff  256 nice RT tasks
# so 4 enabled the ONE bit the comment did not intend — keyboard control — and
# left sync, remount-read-only and reboot switched off. 16 + 32 + 128 = 176 is
# what the comment always described.
#
# This is not cosmetic for this product's buyer. Alt+SysRq+R-E-I-S-U-B is the
# documented way to shut a frozen laptop down without cutting the power and
# risking the filesystem, and every one of the letters that does the actual
# saving — S sync, U remount-read-only, B reboot — was disabled. Somebody with
# a hung machine followed the standard advice and nothing happened.
kernel.sysrq = 176

# Filesystem link protections
# Not hardening — a limit a KDE desktop genuinely runs out of.
#
# The kernel default for inotify instances is 128 per user, and Plasma is a
# heavy user of file watches: Baloo indexing, every open Dolphin window, KWin,
# the clipboard, Discover, plus whatever the owner is running. Exhausting it
# does not produce an error anybody sees — file managers simply stop noticing
# that files changed, "save" appears to do nothing in some editors, and
# newly-copied files do not appear until a manual refresh. It reads as an
# unreliable desktop rather than as a resource limit.
#
# Both numbers are what mainstream desktop distributions have shipped for years,
# and the memory cost is trivial: a watch is on the order of a hundred bytes.
fs.inotify.max_user_instances = 8192
fs.inotify.max_user_watches = 524288

fs.protected_hardlinks = 1
fs.protected_symlinks = 1
fs.protected_fifos = 1
fs.protected_regular = 2
# Restrict core dumps of setuid programs (info-leak prevention)
fs.suid_dumpable = 0

# Network hardening
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv4.conf.all.log_martians = 1
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.icmp_ignore_bogus_error_responses = 1
net.ipv4.tcp_syncookies = 1

# Maximise mmap ASLR entropy. GrapheneOS's practice, and one of the few things
# from an Android hardening project that transfers to a Debian desktop unchanged.
#
# Debian ships CONFIG_ARCH_MMAP_RND_BITS=28 — read directly out of the trixie
# amd64 kernel config, not assumed — while x86-64 allows up to 32. Each extra
# bit doubles the number of places the mmap base can land, so this is 8x more
# placements for one get_random_long() and a mask, once per execve.
#
# 31, NOT 32, AND THE DIFFERENCE IS NOT COSMETIC. At exactly 32 the sanitizers
# break: ASan/MSan/TSan binaries hit DEADLYSIGNAL loops or bare segfaults
# roughly four runs in ten, non-deterministically, and it is not cured by a
# modern toolchain. Free ships no compiler and is immune, but Pro ships
# build-essential, docker.io, podman and distrobox — and distrobox exists
# precisely to run other distributions' toolchains. vm.mmap_rnd_bits is NOT
# namespaced and Docker rejects --sysctl vm.*, so a Pro owner who tripped it
# could not fix it from inside the container. 28 through 31 are all safe.
#
# ONE VALUE ON BOTH EDITIONS. A free-32/Pro-31 split would read as "you paid $39
# for less ASLR", which is the edition rule backwards.
#
# HONEST ABOUT WHAT IT BUYS: it costs nothing, and it does not change an
# attacker's plan. Brute-forcing mmap base was already not the technique anyone
# uses at 28 bits, and an information leak defeats 28, 31 and 32 identically.
# This is taken because it is free, not because it closes anything.
#
# Not vm.mmap_rnd_compat_bits — its maximum is 16, and raising it squeezes the
# 32-bit address space that Pro's wine32:i386 and mesa-vulkan-drivers:i386 need.
#
# Fails LOUD if ever wrong: proc_dointvec_minmax rejects an out-of-range value
# with EINVAL and systemd-sysctl logs it. Verify on a booted machine with
# `sysctl vm.mmap_rnd_bits`, which must print 31. Note it is not "every
# process" — systemd-sysctl runs before sysinit.target, so PID 1 and anything
# from the initrd keep 28.
vm.mmap_rnd_bits = 31
