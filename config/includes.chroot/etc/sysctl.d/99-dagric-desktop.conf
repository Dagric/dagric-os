# Dagric OS — desktop responsiveness
# Kept separate from 99-dagric-hardening.conf on purpose: that file is a
# security posture and this one is a performance trade-off. Mixing them means
# nobody can revert one without auditing the other.
#
# Deliberately short. Every desktop "tweak list" on the internet wants a dozen
# more lines here; the ones below are the only ones that survived being checked
# against kernel 6.12.96+deb13 and the built image. See the rejection list at
# the bottom of config/hooks/normal/0250-performance.hook.chroot for what was
# dropped and why.

# Reclaim dentry and inode caches half as eagerly as the default of 100.
# Target hardware is a slow disk: re-walking a directory tree after the kernel
# dropped its dentries costs seeks, and seeks are the thing we cannot buy back.
# Holding that metadata is cheap — a dentry is tens of bytes, a JPEG in the
# page cache is megabytes.
#
# Risk: on a filesystem with millions of files this leaves more kernel memory
# pinned in slab. 50 is the floor worth using — below about 50 the kernel gets
# reluctant to reclaim inodes at all, which turns a tuning knob into a leak.
vm.vfs_cache_pressure = 50

# vm.swappiness and vm.page-cluster are NOT set here. They are only correct
# while swap is zram, so they live in a drop-in on the unit that provides zram:
#   /etc/systemd/system/zramswap.service.d/10-dagric-vm-tuning.conf
# If a user turns zram off, those values must go back to the kernel defaults
# rather than staying behind and pessimising a real disk swap partition.
