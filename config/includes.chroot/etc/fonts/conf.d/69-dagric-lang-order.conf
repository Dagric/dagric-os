<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Dagric OS: put the Latin faces in front of the CJK fallback for the generic
  families.

  The image ships fonts-droid-fallback so Chinese, Japanese and Korean text is
  never tofu (and Pro adds the full Noto CJK set). The cost of a fallback font
  is that fontconfig sometimes reaches it FIRST for glyphs the Latin fonts also
  carry - quotation marks, dashes, middle dots - and then English text renders
  with subtly wrong punctuation: full-width quotes, a too-long dash, spacing
  that looks broken in a way nobody can name. AnduinOS ships the same class of
  ordering for the same reason.

  A numbered drop-in in conf.d, NOT /etc/fonts/local.conf: local.conf belongs
  to the administrator, and owning it would silently discard their edits - the
  same mistake 0500-desktop-defaults documents about package-owned files.

  THE NUMBER IS THE WHOLE TRICK, so do not renumber this file casually. fontconfig
  reads conf.d in plain lexicographic order, and each "prepend" puts its family
  in FRONT of whatever the rules before it produced - so the LAST file to fire
  wins the first position. This shipped for about an hour as 60-dagric-lang-order,
  which sorts ahead of Debian's own 60-latin.conf and ahead of the fallback font's
  65- drop-in, meaning both of them would have prepended over the top of it and
  the file would have done exactly nothing while looking entirely correct.
  69 puts it after everything in the generic-alias band, which is the only
  position from which it can do its job.

  Prepending a family that is not installed is harmless (fontconfig skips it),
  so the free edition, where Noto CJK is absent, loses nothing.
-->
<fontconfig>
  <match target="pattern">
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend"><string>Noto Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend"><string>Noto Serif</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend"><string>Noto Sans Mono</string></edit>
  </match>
</fontconfig>
