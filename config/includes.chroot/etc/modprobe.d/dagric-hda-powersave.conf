# Dagric OS - do not autosuspend the HD-audio codec.
#
# Debian's kernel ships CONFIG_SND_HDA_POWER_SAVE_DEFAULT=10, so the codec
# powers down after ten idle seconds. On the pre-2018 machines this OS is sold
# to rescue, that is audible: a pop on every wake and the first half-second of
# any sound clipped - the start of a notification, the first word of a video.
# It reads as "the sound is broken", and it is the single most-reported audio
# annoyance on older hardware.
#
# The trade, stated: a codec that never sleeps costs a few tenths of a watt.
# On a desktop that is nothing; on a laptop battery it is real but small, and
# the popping is worse for this audience than the minutes of runtime.
# CachyOS ships a battery-aware version of this that re-enables power saving
# on discharge; that refinement needs a udev helper and a boot test, so it is
# a follow-up rather than a first move.
options snd_hda_intel power_save=0 power_save_controller=N
