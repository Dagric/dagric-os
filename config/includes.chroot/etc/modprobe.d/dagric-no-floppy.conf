# Dagric OS — do not probe a floppy drive that is not there.
#
# MEASURED in a VM install: 14 kernel I/O errors at every boot —
#
#   Floppy drive(s): fd0 is 2.88M AMI BIOS
#   I/O error, dev fd0, sector 0 op 0x0:(READ) flags 0x0 phys_seg 1 prio class 2
#
# because the emulated chipset advertises a floppy controller with no media in
# it. The same happens on the pre-2012 desktops this product is sold to rescue,
# whose motherboards still carry a controller long after the drive was removed.
# Nothing is broken by it, but a boot that logs a dozen I/O errors reads as a
# failing machine to anyone who looks, and it is noise in every bug report an
# owner will ever send.
#
# `install floppy /bin/true` RATHER THAN `blacklist floppy`, and the difference
# is not cosmetic: blacklist only suppresses ALIAS-based autoloading, so a
# driver the kernel probes directly still loads. Verified on a running system —
# with `blacklist floppy` in place, lsmod still showed the module loaded and the
# errors still appeared. The install form refuses the load outright.
#
# Anyone who genuinely has a floppy drive in 2026 can delete this file.
install floppy /bin/true

# ONE MORE LAYER, and it is the one that actually does the work: the module is
# loaded from the INITRAMFS, before /etc/modprobe.d on the real root can be
# read. Verified on a running system — with this file in place but the initramfs
# untouched, lsmod still showed floppy loaded and dmesg still carried the
# errors. After `update-initramfs -u` (which copies /etc/modprobe.d into the
# image) and a reboot: 0 errors, module not loaded.
#
# No action is needed in the build: config/includes.chroot lands BEFORE hooks,
# and 0700-plymouth.hook.chroot regenerates the initramfs, so this file is
# already inside it by the time the ISO is assembled.
#
# /bin/true, NOT /bin/false. Both refuse the load, but a non-zero exit makes
# udev log its own complaint —
#   (udev-worker): Error running install command '/bin/false' for module floppy: retcode 1
# — which trades a dozen I/O errors for one error line and leaves the boot log
# still looking like something went wrong. /bin/true declines silently.
