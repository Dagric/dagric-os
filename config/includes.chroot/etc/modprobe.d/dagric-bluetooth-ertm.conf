# Dagric OS — disable L2CAP Enhanced Retransmission Mode.
#
# This is what makes an Xbox One or Series controller pair over Bluetooth and
# stay paired. With ERTM enabled the pairing either never completes or drops
# within seconds, and nothing in the interface explains why — the controller
# blinks and gives up, which reads as "Linux does not support my hardware"
# rather than as one kernel module parameter.
#
# That controller matters here more than it would elsewhere: it is the one this
# audience already owns, because it came with the Windows machine they are
# leaving. Bazzite applies the same setting to every image it ships rather than
# gating it on detecting a controller, reasoning that the cost is near-zero and
# the failure it prevents is silent.
#
# The trade: ERTM is an optional L2CAP reliability mode, so affected links fall
# back to basic mode. The devices that negotiate it are HID and audio
# peripherals that work correctly without it.
options bluetooth disable_ertm=1
