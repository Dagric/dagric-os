# Dagric OS — live-session identity.
#
# THE LIVE SESSION INTRODUCED ITSELF AS "Debian Live user".
#
# It is printed at the top of the application launcher, next to the avatar, on
# the first screen a person opens after booting the USB — and it was the one
# place the product still said Debian by accident rather than by attribution.
# Confirmed on a real capture from the booted free ISO, not inferred: the
# launcher header read "Debian Live user".
#
# live-config's passwd component creates the autologin account at boot and takes
# its GECOS field from LIVE_USER_FULLNAME, defaulting to "Debian Live user" on
# Debian. Nothing in this tree had ever set it.
#
# WHY A CONFIG FILE RATHER THAN THE KERNEL COMMAND LINE. live-config accepts
# `user-fullname="..."` as a boot parameter, and auto/config's --bootappend-live
# is where every other live-config option here is set (hostname=dagric,
# username=live). But the value contains a SPACE, and it would have to be quoted
# INSIDE the already-quoted --bootappend-live string, then survive live-build
# writing it into isolinux and GRUB menus and 0950-boot-branding rewriting those
# menus again. Every one of those steps is a place for the quoting to break, and
# the failure mode is silent: the account is created with a truncated name, or
# the rest of the command line after the space is parsed as separate parameters.
# /etc/live/config.conf.d/*.conf is sourced as shell by live-config itself, so a
# quoted value with a space is simply correct and nothing has to re-quote it.
#
# THIS IS NOT DE-ATTRIBUTION. Dagric is Debian-based and says so deliberately in
# the places that matter: os-release keeps ID_LIKE=debian because package tools
# and third-party installers read it, site/index.html and every page footer say
# "Built on Debian", and site/licenses.html credits the project properly. What
# changed is one incidental string in the UI that named the upstream distribution
# where the product's own name belongs.
#
# "Dagric user" rather than a person's name on purpose: this account only exists
# in the live trial. An installed machine gets whatever name the owner typed
# into Calamares, so this string is never what a customer ends up with.
LIVE_USER_FULLNAME="Dagric user"
