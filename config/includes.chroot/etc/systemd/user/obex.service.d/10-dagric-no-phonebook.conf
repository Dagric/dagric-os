# Dagric OS — stop obexd reaching for a contacts registry this image does not
# have, twice on every login.
#
# WHAT AN OWNER'S LOG SAYS WITHOUT THIS, on every single boot:
#
#   obexd[1199]: Unable to acquire registry: Error calling StartServiceByName
#   for org.gnome.evolution.dataserver.Sources5: Failed to execute program ...
#   No such file or directory
#
# WHAT IS AND IS NOT BROKEN — measured, because the first reading of this was
# wrong. obexd starts fine and successfully owns org.bluez.obex, so BLUETOOTH
# FILE TRANSFER WORKS. The failure is narrower: the phonebook-flavoured plugins
# (pbap, irmc, mas, mns) want evolution-data-server's source registry to serve
# CONTACTS and MESSAGES over Bluetooth, and only the e-d-s libraries are on this
# image — they arrive as hard Depends of bluez-obexd — not the daemon that
# provides org.gnome.evolution.dataserver.Sources5.
#
# WHY NOT JUST INSTALL evolution-data-server. Measured with apt-get --simulate:
# 32 new packages, including libjavascriptcoregtk-4.1-0 — an entire WebKit
# JavaScript engine — plus libmanette (gamepads), libical, libcanberra-gtk3 and
# a GNOME calendar stack. That is a large, GNOME-flavoured dependency tree on a
# Plasma image to enable Bluetooth CONTACTS SYNC, a profile almost nobody uses,
# on a product that already ships KDE Connect for exactly the phone-integration
# job and does it better. "Free stays lean" is the rule; this is what it is for.
#
# PLUGIN NAMES ARE READ OUT OF THE BINARY, NOT GUESSED: `strings` on obexd lists
# filesystem, irmc and pbap; mas and mns are named in its own exclusion output.
# `filesystem` is the one that carries OPP and FTP — sending and browsing files
# — and is deliberately NOT excluded.
#
# VERIFIED on a running session: with this drop-in, the current obexd process
# logs "Excluding irmc/pbap/mas/mns", ZERO registry errors, still owns
# org.bluez.obex, and does not exclude filesystem.
#
# If Bluetooth contacts sync is ever wanted, the fix is to install
# evolution-data-server and delete this file — not to edit the exclusion list.
[Service]
ExecStart=
ExecStart=/usr/libexec/bluetooth/obexd --noplugin=pbap,irmc,mas,mns
