# Dagric OS — bound the journal.
#
# /var/log/journal exists in the image (verified), so journald storage is
# persistent and journald.conf is otherwise stock. Stock means SystemMaxUse
# defaults to 10% of the filesystem holding /var/log/journal, capped at 4 GB.
# On the machines this OS is aimed at that is absurd in both directions: 4 GB
# of logs on a 500 GB drive, and 3+ GB on the 32 GB eMMC in a cheap Windows 10
# laptop — where it is a meaningful slice of the disk the user actually bought
# the OS to keep using.
#
# This is honestly a footprint fix, not a speed fix. The write traffic journald
# generates on an idle desktop is small; capping it does not make the machine
# feel faster. What it does is stop logs quietly eating a small disk, and keep
# the journal small enough that journalctl and `systemd-analyze blame` stay
# fast when someone is actually debugging.
#
# 200M is generous — weeks of a desktop's logs — so support diagnostics are not
# compromised. SystemMaxFileSize is deliberately left unset; systemd derives it
# as one eighth of SystemMaxUse, and inventing a second number here would only
# be one more thing to get wrong.

[Journal]
SystemMaxUse=200M

# Old hardware produces log spam: a flaky i915, ACPI errors, a dying disk
# retrying. Before /var is mounted, and any time storage falls back to
# volatile, that spam lands in a tmpfs under /run — i.e. in RAM, on a machine
# that may only have 4 GB of it. Default is 10% of RAM; cap it far lower.
RuntimeMaxUse=64M
