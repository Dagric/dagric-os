# Dagric OS — bound how long shutdown can hang.
#
# systemd's default DefaultTimeoutStopSec is 90s (verified: the key is present
# but commented out in /etc/systemd/system.conf on this image, so upstream's
# default applies). When one service refuses to stop, the user watches
# "A stop job is running for ... (1min 30s)" on a black screen. Someone who
# just moved off Windows reads that as "the new operating system froze while
# shutting down" and reaches for the power button — which is the one action
# that can actually corrupt their filesystem.
#
# 20s is long enough for anything on a desktop to flush and short enough that
# nobody concludes the machine is dead.
#
# Risk: a service that legitimately needs longer gets SIGKILLed. Services that
# need longer are supposed to declare it themselves, and the one on this image
# that matters already does — unattended-upgrades.service sets
# TimeoutStopSec=1800 in its own unit (verified), so an in-flight apt
# transaction is still protected and this cannot leave dpkg half-configured.
# Pro's virtualisation and container services likewise carry their own
# timeouts. Anything added later that needs more must set TimeoutStopSec= in
# its unit rather than relying on this default.
#
# DefaultTimeoutStartSec is deliberately left at 90s: a slow spinning disk can
# legitimately take a long time to bring a service up at boot, and shortening
# that would turn slow hardware into failed hardware.

[Manager]
DefaultTimeoutStopSec=20s
