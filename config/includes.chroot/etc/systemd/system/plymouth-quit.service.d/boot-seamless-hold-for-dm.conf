#
# Dagric OS — stop the splash disappearing before anything replaces it.
#
# THE BUG, MEASURED. Booting the 1.0 free ISO in QEMU and screenshotting every
# two seconds, the frames from t=42s to t=50s are pure black — not "dark", mean
# luminance 0.000000, nothing on screen but a 7x2 pixel console cursor in the
# top-left corner. That is eight seconds of a dead-looking machine sitting
# between the Dagric splash and KDE's startup screen, and it is the single
# longest black stretch in the boot.
#
# THE CAUSE. plymouth-quit.service is pulled by multi-user.target and ordered
# only after systemd-user-sessions.service, which is reached long before the
# display manager has a display server up. So Plymouth tears the splash down on
# its own schedule and SDDM starts on its own, and the gap between them is
# whatever X/Wayland startup costs on that machine. Debian knows: its own
# sddm.service carries the fix as a COMMENT — "If using tty1 and plymouth, sddm
# will fail till plymouth stops / consider using: After=plymouth-quit.service"
# — and ships it commented out, leaving the choice to the distribution. This is
# the distribution making the choice.
#
# TWO CHANGES, BOTH NEEDED, FOR DIFFERENT REASONS.
#
# After=display-manager.service holds the splash up until SDDM has actually
# been started rather than until user sessions are merely allowed. This is
# ordering only, never a requirement: if display-manager.service is not in the
# transaction at all — a text-mode boot, systemd.unit=multi-user.target, a
# server install with no DM — systemd ignores the ordering entirely and
# plymouth-quit runs exactly as it does today. If SDDM starts and then fails,
# After= is satisfied by it finishing activation whether or not it succeeded,
# so the splash still goes away.
#
# --retain-splash covers the rest. SDDM runs its display server on a different
# VT from the one Plymouth owns, so even perfect ordering leaves a moment where
# Plymouth has released the console and the compositor has not yet drawn.
# --retain-splash leaves the last frame on the framebuffer instead of clearing
# it, which is what turns that moment from black into the splash still being
# there. This is the same call Fedora makes for GDM.
#
# THE RISK, STATED. If SDDM never manages to draw, the machine now shows a
# frozen splash rather than a console full of errors, which looks worse to
# diagnose. Ctrl+Alt+F2 still reaches a getty, sddm.service has Restart=always,
# and plymouth-quit keeps its 20-second TimeoutSec. The trade is deliberate: a
# black screen for eight seconds on every single boot is a certainty, and a
# frozen splash on a machine whose display manager is already broken is not.
[Unit]
After=display-manager.service

[Service]
ExecStart=
ExecStart=-/usr/bin/plymouth quit --retain-splash
