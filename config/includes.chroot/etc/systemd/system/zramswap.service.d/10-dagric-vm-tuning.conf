# Dagric OS — VM tuning that is only correct while swap is zram.
#
# Why a unit drop-in and not /etc/sysctl.d: both settings below are wrong on a
# machine whose swap is a disk partition. Calamares offers a small swap
# partition (see modules/partition.conf, userSwapChoices), so "no zram" is a
# state this OS can actually reach — a user disabling zram from a terminal, or
# zramswap.service failing on a kernel without the module. Attaching the values
# to zramswap.service means they appear exactly when zram does and are undone
# when it goes away, instead of silently mis-tuning a disk swap forever.
#
# systemd runs systemd-sysctl.service in sysinit.target and zramswap.service in
# multi-user.target, so these always land after /etc/sysctl.d has been applied.
# If zramswap start fails, ExecStart aborts and ExecStartPost never runs — the
# kernel defaults stay, which is the safe outcome.

[Service]
# vm.swappiness = 100 (default 60).
# The near-universal advice is swappiness=10. That advice was written for disk
# swap and is actively wrong here: swapping to zram costs a memcpy and a
# decompress, while evicting page cache costs a re-read from a 5400 rpm platter
# later. With zram present we want the kernel to prefer giving up anonymous
# pages over giving up cache.
#
# vm.page-cluster = 0 (default 3).
# page-cluster=3 reads 8 pages on every swap-in to amortise a disk seek. zram
# has no seek, so 7 of those 8 decompressions are pure waste on every fault.
ExecStartPost=/usr/sbin/sysctl -q -w vm.swappiness=100 vm.page-cluster=0

# Put the kernel defaults back if zram is stopped, so a disk swap partition
# isn't left running with settings that were only ever right for zram.
ExecStopPost=/usr/sbin/sysctl -q -w vm.swappiness=60 vm.page-cluster=3
