# Dagric OS — OpenSnitch does not run in the live session.
#
# THE BUG THIS FIXES, observed on a real Pro install and not from reading code.
# At 42% of a Pro install ("Running command
# /usr/share/calamares/helpers/calamares-sources-media") a modal OpenSnitch
# dialog appeared over Calamares asking whether to allow
#
#     /usr/lib/apt/methods/http, executed from /tmp/calamares-root-fax7dcdx
#
# to resolve deb.debian.org. The Deny button was counting down — "Deny (9)" —
# because the UI's popup defaults to DENY on timeout (opensnitch config.py sets
# global/default_action to ACTION_DENY_IDX when the key is unset). So an owner
# who starts an install and walks away has apt's downloads denied mid-install.
# Nobody is watching an installer at 42%. That is the normal case, not the edge.
#
# WHY NOT JUST PRE-ANSWER THE INSTALLER. Because the installer's apt runs from
# inside the Calamares chroot, its process path is /tmp/calamares-root-<random>,
# so the pre-answer would have to be a regexp over a path in /tmp. /tmp is
# world-writable: any local user could create /tmp/calamares-root-x/ and run a
# binary from it to walk straight through the firewall. On the school and
# library machines Pro is sold into, that is a real bypass. A rule that has to
# trust a path in /tmp is not a rule worth shipping.
#
# WHY OFF IN LIVE IS THE RIGHT ANSWER, not a workaround. The live session is
# ephemeral: every rule OpenSnitch learns there is thrown away at shutdown and
# teaches the installed system nothing. Meanwhile it is the one session in which
# a trusted root process legitimately fetches arbitrary packages from a
# temporary directory. The daemon has nothing to gain there and an install to
# lose.
#
# HOW. live-build puts boot=live on the kernel command line of both boot entries
# (auto/config --bootappend-live and --bootappend-live-failsafe). An installed
# system's GRUB does not. A failed Condition makes systemd SKIP the unit — it is
# reported inactive, not failed, and nothing else is disturbed. The unit stays
# enabled, so the moment the machine boots from disk the firewall is on with no
# further action. 2020-dagric-opensnitch-live hides the tray UI to match, so the
# live session does not show a firewall panel with no daemon behind it.
#
# If you ever remove boot=live from auto/config, this drop-in silently stops
# doing anything and the install-time prompt comes back. The 0600 hook asserts
# both halves at build time so that cannot ship unnoticed.
[Unit]
ConditionKernelCommandLine=!boot=live
