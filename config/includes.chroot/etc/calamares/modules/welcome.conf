---
# Dagric's public minimums and its installer must tell the same story.
# Debian's Calamares default is 15 GiB / 1 GiB RAM, which allowed an install
# that the live hardware check and website both said was below the supported
# floor.  The Pro hook raises storage to 40 GiB; both editions keep 3.5 GiB of
# addressable RAM so a sold-as-4-GB PC is not rejected because firmware uses a
# small portion of it.
showSupportUrl:         true
showKnownIssuesUrl:     true
showReleaseNotesUrl:    true

requirements:
    requiredStorage:    25
    requiredRam:        3.5
    check:
        - storage
        - ram
        - power
        - root
    required:
        - storage
        - ram
        - root
