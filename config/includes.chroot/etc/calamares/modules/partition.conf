# Dagric OS — partitioning defaults for Calamares.
# btrfs by default: Timeshift gets instant atomic snapshots, and a bad
# update can be rolled back instead of reinstalled. ext4 stays available
# for users who choose Manual partitioning.
efiSystemPartition: "/boot/efi"
userSwapChoices:
    - none
    - small
defaultFileSystemType: "btrfs"
availableFileSystemTypes:
    - btrfs
    - ext4

# THE "ENCRYPT SYSTEM" CHECKBOX ON THE GUIDED PATHS, WHICH WAS NOT APPEARING.
#
# app-accounts.html tells buyers in so many words: "Full-disk encryption is
# offered by the installer... a stolen laptop is a lost piece of hardware rather
# than a lost life. If you did not [take it], it cannot be added afterwards
# without reinstalling." That promise needs this key.
#
# Calamares only shows the encryption passphrase checkbox on the automated
# paths (erase disk, replace partition, install alongside) when
# enableLuksAutomatedPartitioning is true, and it defaults to FALSE when the key
# is absent. Dagric ships its own partition.conf, which REPLACES the packaged
# one wholesale — Calamares does not merge module configs — so whatever the
# base calamares-settings-debian set for this key was dropped the moment this
# file existed, and the guided installer offered no encryption at all. The one
# audience this is sold to — schools, libraries, developers with machines that
# travel — is exactly the one for whom an unencrypted disk is the real risk.
#
# Setting it true only ADDS the checkbox; the buyer still chooses. It cannot
# break a working path, which is why it is safe to set without a booted
# installer to watch — though it SHOULD be watched on the next real install,
# because nothing here has yet confirmed the checkbox renders on this Calamares.
enableLuksAutomatedPartitioning: true
