#
# Dagric OS — strip the live-session packages out of the INSTALLED system.
#
# THIS REPLACES calamares-settings-debian's OWN packages.conf, WHICH FAILED
# EVERY INSTALL. Reproduced on a BIOS erase-disk install of the freshly built
# free ISO, after the disk had already been partitioned and populated:
#
#     Installation Failed — Package Manager error
#     The command apt-get --purge -q -y remove live-boot live-boot-doc
#     live-config live-config-doc live-config-systemd live-config-systemd
#     live-tools live-task-localisation live-task-recommended
#     calamares-settings-debian returned error code 100.
#
# apt exits 100 when it cannot locate a package, and `remove` in the Calamares
# packages module treats a non-zero exit as fatal. FIVE of the ten names in
# Debian's list are not on this image at all — measured against the shipped
# squashfs, not guessed:
#
#     live-boot-doc            ABSENT
#     live-config-doc          ABSENT
#     live-tools               ABSENT
#     live-task-localisation   ABSENT
#     live-task-recommended    ABSENT
#
# That list is written for a stock Debian live image, which pulls the
# live-task-* metapackages and their documentation. Dagric's system.list.chroot
# installs live-boot, live-config and live-config-systemd deliberately and
# nothing else, and auto/config builds with --apt-recommends false, which drops
# the -doc packages. So Debian's config asks apt to remove five things that
# were never installed, and the install dies at the last module.
#
# Same defect family as the dropped Recommends this tree keeps hitting
# (wpasupplicant, alsa-ucm-conf, rtkit, man-db) — but one level up, in the
# INSTALLER's assumptions rather than the image's.
#
# WHY try_remove RATHER THAN A CORRECTED remove LIST. A hand-trimmed list would
# fix today's failure and re-break the moment somebody adds or drops a live
# package, and it would break in the worst place: after the target disk has been
# wiped and filled. try_remove asks for exactly the same removals and tolerates
# the ones that are not there, so the install cannot be killed again by a name
# that has merely gone out of date. The full list is kept — including the five
# absent today — so that if a future image does carry them they still get
# stripped from the installed system.
#
# live-config-systemd appears once here. Debian's list names it TWICE, which is
# harmless but is the kind of copy-paste that suggests the list was never
# exercised.
#
# AND calamares ITSELF, which Debian's list does not name and which therefore
# survived every install. Measured on a machine this module had already run
# against — every live-* package and calamares-settings-debian gone, exactly
# matching the list below, and `calamares` still installed:
#
#     dpkg -s calamares                 -> PRESENT
#     dpkg -s calamares-settings-debian -> gone
#     dpkg -s live-boot                 -> gone
#
# What that leaves on the owner's finished machine is a launcher entry reading
#
#     Name=Install System
#     Exec=sh -c "pkexec calamares"
#
# with no NoDisplay and no Hidden — a menu item, on a computer that is already
# installed, offering to run the disk partitioner as root. It is a SECOND entry:
# the branded one an owner is meant to use comes from
# calamares-install-debian.desktop, which 0500-desktop-defaults rebrands and
# which ships in calamares-settings-debian — removed on the line above, so after
# an install the only installer entry left is the unbranded one.
#
# It would very likely not even work. /etc/calamares/settings.conf belongs to
# calamares-settings-debian, so the surviving entry is a partitioner pointed at
# a configuration that was deleted with its package. "Probably errors" is not a
# defence for shipping it; "definitely partitions" would be far worse.
#
# Safe to remove for the same reason live-boot is: this module runs apt inside
# the INSTALLED TARGET, not against the live filesystem, so the copy of
# Calamares currently doing the installing is untouched and finishes normally.
# Its only reverse-dependency, calamares-settings-debian, goes on the line
# above. libkpmcore12 is not orphaned either — partitionmanager is shipped
# deliberately and needs it, which is also why "Disks" survives as the tool an
# owner should reach for instead.
#
# STILL OPEN, deliberately not done here: in the LIVE session both entries are
# present and both work, so an owner about to install sees "Install Dagric OS"
# and "Install System" side by side. That is clutter rather than breakage, and
# the obvious fix — a NoDisplay shadow in /usr/local/share/applications — has a
# failure mode much worse than the bug: if the branded entry ever goes missing,
# hiding this one leaves a live USB with no way to start the install from the
# menu at all. It needs an assertion that the branded entry exists before the
# shadow is allowed to apply.
backend: apt

operations:
  - try_remove:
      - 'live-boot'
      - 'live-boot-doc'
      - 'live-config'
      - 'live-config-doc'
      - 'live-config-systemd'
      - 'live-tools'
      - 'live-task-localisation'
      - 'live-task-recommended'
      - 'calamares-settings-debian'
      - 'calamares'
