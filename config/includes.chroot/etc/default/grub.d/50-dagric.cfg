# Dagric OS — GRUB identity on installed systems.
GRUB_DISTRIBUTOR="Dagric OS"
# Five, not two. Two shipped promises depend on an owner catching this menu:
# the manual's snapshot rollback ("Restart. At the boot menu choose the
# snapshots submenu and pick one by date") and, now that os-prober runs below,
# choosing Windows on a dual-boot machine. Two seconds is not catchable on an
# NVMe machine that reaches GRUB in a blink — the menu is gone before somebody
# who just watched an update break their desktop has finished reaching for the
# arrow key, and that is the one moment this menu exists for.
#
# Five is Debian's own default and still reads as a quick boot. The live ISO
# deliberately uses ten (0950-boot-branding), because on the stick the menu is
# also where the accessible entry and the safe-graphics entry live.
GRUB_TIMEOUT=5
GRUB_BACKGROUND="/usr/share/dagric/splash/splash.png"

# THE DESIGNED MENU, ON THE INSTALLED MACHINE TOO.
#
# The full theme — 9-slice panels, the progress-bar slices, three fonts, the
# background — has been shipping inside the image at
# /usr/share/dagric/boot/grub-theme/ all along, and 0950-boot-branding.hook.binary
# copies it into the ISO. Nothing ever set GRUB_THEME, so it reached the USB and
# stopped there: install Dagric and the boot menu goes back to stock GRUB chrome
# with a background image behind it. Same defect as the kernel flags below —
# the machine somebody installed booted worse than the stick they installed it
# from — still live, one layer down, in the bootloader itself.
#
# Pointed at /usr/share rather than copied to /boot/grub/themes on purpose: the
# assets are 394 KB and they are already on the disk. GRUB reads grub.cfg off
# this same root filesystem before any of this runs, so it can read the theme
# from there too. (An encrypted install is no worse off: GRUB draws its
# passphrase prompt before it can read ANY of the root, themed or not.)
#
# Safe if it ever goes stale: Debian's 00_header checks the file is readable
# before emitting `set theme=`, and a missing theme leaves the text menu over
# GRUB_BACKGROUND — precisely what ships today.
#
# ONE THING FOR THE BOOT TEST, because I could not check it from here: 00_header
# auto-loads the theme's fonts by globbing the theme directory, and Dagric's
# .pf2 files live in a fonts/ subdirectory rather than beside theme.txt. If the
# glob does not reach them the menu still themes correctly and simply draws in
# GRUB's built-in font — benign, and visibly different from the ISO's menu,
# which is the tell. Fix would be moving the three .pf2 files up one level.
GRUB_THEME="/usr/share/dagric/boot/grub-theme/theme.txt"

# One mode set, not two. GRUB picks a video mode to draw the menu; without
# GFXPAYLOAD=keep the kernel then re-modesets to native, so the identical
# artwork visibly re-lays-out with a black flash between menu and splash — on a
# boot whose whole design rule (see the Plymouth theme's header) is that the
# same picture stays in the same place at the same size the entire way through.
GRUB_GFXMODE=auto
GRUB_GFXPAYLOAD_LINUX=keep

# FIND WINDOWS AND PUT IT IN THE MENU.
#
# The site promises this in three separate places — faq.html, getting-started
# and the homepage all say "choose Install alongside ... at startup you choose
# which to boot" — and installer.list.chroot pins os-prober so somebody clearly
# intended it to work. It could not. Since GRUB 2.06 /etc/grub.d/30_os-prober
# refuses to run unless GRUB_DISABLE_OS_PROBER is literally the string "false",
# and nothing in this tree ever set it (grep across config/, auto/ and build.sh
# returns nothing). trixie ships GRUB 2.12.
#
# So a Windows-10 refugee took the exact path the product is sold on, rebooted,
# and got a menu with no Windows in it. Windows was still there untouched — but
# from the owner's chair the new OS ate their old one, and getting back means
# BIOS boot-order fiddling or a terminal. That is the highest-volume refund
# conversation this audience could possibly generate.
#
# Upstream turned this off by default over a real concern: os-prober mounts and
# reads other partitions, so a hostile OS sharing the disk could influence the
# menu. Every consumer distro that offers dual-boot turns it back on, because
# for this audience a machine that hides Windows is the bigger harm.
#
# NOT YET CONFIRMED, and it decides only whether this line is a fix or a
# harmless restatement: calamares-settings-debian's grubcfg module may already
# write this key into the target's /etc/default/grub. Could not check — the
# squashfs is compressed and WSL is down. Safe either way: grub-mkconfig sources
# /etc/default/grub first and /etc/default/grub.d/*.cfg after, so this drop-in
# wins if there is a conflict and agrees if there is not.
#
# The real test is a dual-boot install in the QEMU harness with a second
# NTFS-bearing disk, then grep -c menuentry on the installed grub.cfg.
GRUB_DISABLE_OS_PROBER=false

# The same three flags auto/config puts on --bootappend-live, for the same
# measured reasons. They were missing here, which meant every machine booted
# WORSE after installing Dagric than it did from the USB stick it installed
# from — the one comparison a new owner is guaranteed to make.
#
#   plymouth.ignore-serial-consoles — the one that matters. Plymouth refuses to
#   draw at all when the kernel command line names a serial console and falls
#   back to text. Measured mean frame luminance across the splash window was
#   0.00252 without it (black, start to finish) and 0.0684 with it. Firmware
#   advertising a serial console is not exotic: business desktops with AMT,
#   anything with serial redirection, every VPS. All of them installed Dagric
#   and got no boot branding whatsoever, on the machine they paid for.
#
#   vt.global_cursor_default=0 — removes the blinking console cursor the VT
#   handoff leaves in the corner. Measured, not assumed: a 7x2 pixel lit block
#   at (1,12) on an otherwise black frame.
#
#   loglevel=3 — `quiet` is only loglevel=4, so KERN_ERR and KERN_WARNING still
#   print straight over the splash. This is what keeps a laptop's ACPI or
#   firmware grumbling off a paying customer's boot screen.
#
# dagric.a11y=1 is deliberately NOT here, exactly as in auto/config: it would
# start the screen reader talking on every single boot rather than on the one
# menu entry that offers it. See 0950-boot-branding.hook.binary.
GRUB_CMDLINE_LINUX_DEFAULT="quiet splash plymouth.ignore-serial-consoles vt.global_cursor_default=0 loglevel=3"
