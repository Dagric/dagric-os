# Dagric OS — GRUB identity on installed systems.
GRUB_DISTRIBUTOR="Dagric OS"
GRUB_TIMEOUT=2
GRUB_BACKGROUND="/usr/share/dagric/splash/splash.png"

# The same three flags auto/config puts on --bootappend-live, for the same
# measured reasons. They were missing here, which meant every machine booted
# WORSE after installing Dagric than it did from the USB stick it installed
# from — the one comparison a new owner is guaranteed to make.
#
#   plymouth.ignore-serial-consoles — the one that matters. Plymouth refuses to
#   draw at all when the kernel command line names a serial console and falls
#   back to text. Measured mean frame luminance across the splash window was
#   0.00252 without it (black, start to finish) and 0.0684 with it. Firmware
#   advertising a serial console is not exotic: business desktops with AMT,
#   anything with serial redirection, every VPS. All of them installed Dagric
#   and got no boot branding whatsoever, on the machine they paid for.
#
#   vt.global_cursor_default=0 — removes the blinking console cursor the VT
#   handoff leaves in the corner. Measured, not assumed: a 7x2 pixel lit block
#   at (1,12) on an otherwise black frame.
#
#   loglevel=3 — `quiet` is only loglevel=4, so KERN_ERR and KERN_WARNING still
#   print straight over the splash. This is what keeps a laptop's ACPI or
#   firmware grumbling off a paying customer's boot screen.
#
# dagric.a11y=1 is deliberately NOT here, exactly as in auto/config: it would
# start the screen reader talking on every single boot rather than on the one
# menu entry that offers it. See 0950-boot-branding.hook.binary.
GRUB_CMDLINE_LINUX_DEFAULT="quiet splash plymouth.ignore-serial-consoles vt.global_cursor_default=0 loglevel=3"
