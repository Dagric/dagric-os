# Dagric OS — don't broadcast a permanent hardware address to every Wi-Fi
# network the owner walks past.
#
# WHY THIS EXISTS. site/features.html headlines "Privacy that isn't a setting"
# and site/privacy.html enumerates our outbound traffic down to the
# captive-portal ping — while the machine announced one permanent, globally
# unique MAC to every access point in range, forever. That is the single most
# effective way a person is tracked between physical locations, and Windows 10
# has had a "Use random hardware addresses" toggle for years, so a switcher
# LOSES a privacy control by moving to Dagric. Nothing in the tree set a MAC
# policy before this file.
#
# `stable`, NOT `random`, and the difference matters more than it looks.
#   random  — a new address on every association. Breaks DHCP reservations,
#             breaks "remember this device" on hotel and airline portals,
#             re-triggers paid-Wi-Fi logins, and makes a home router's device
#             list unreadable. It also defeats nothing extra: the tracking that
#             matters is cross-VENUE, and `stable` already stops that.
#   stable  — derived per connection, so the address is constant for a given
#             network and different between networks. The café cannot recognise
#             the laptop that was in the airport, and the home router still
#             sees the same device every evening.
#
# connection.stable-id is documented here as self-documentation. ${CONNECTION}
# is already NetworkManager's default seed for `stable`; it is written out so
# that a reader knows WHICH scope the stability is over without going to the
# manual, not because omitting it would change behaviour.
#
# ETHERNET IS DELIBERATELY LEFT ALONE. Wired networks are where MAC identity is
# load-bearing rather than invasive: 802.1X port authentication in schools and
# offices, Wake-on-LAN, and wired DHCP reservations all key off the permanent
# address, and Dagric is sold into exactly those buildings. There is also no
# walking-past threat on a cable. Setting only wifi.cloned-mac-address confines
# this to the case that benefits.
#
# Hotspot and shared-connection profiles are untouched for the same reason —
# NetworkManager applies this to `wifi` station mode; an AP-mode profile
# announcing a rotating BSSID would just confuse the phones connecting to it.
#
# /etc/NetworkManager/conf.d outranks /usr/lib/NetworkManager/conf.d, so no
# package drop-in can quietly shadow this. A per-connection override is still
# available to the owner in Wi-Fi settings -> Advanced -> "Restrict to device",
# which manual/app-network.html now documents for MAC-filtered campus networks
# — the one place this setting can cost somebody their connection.
[connection]
wifi.cloned-mac-address=stable
connection.stable-id=${CONNECTION}
