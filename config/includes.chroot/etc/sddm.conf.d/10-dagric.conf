# Dagric OS — which login screen SDDM shows.
#
# This used to say Current=breeze, with the Dagric background and logo pushed
# into Breeze's layout through usr/share/sddm/themes/breeze/theme.conf.user.
# That was a reasonable stopgap and it had a ceiling: Breeze's Main.qml reads
# six keys and no more, so there was no way to change the layout, the type or
# the spacing — and the layout was KDE's, so a Plasma update could rearrange
# the screen the owner sees every boot without anything in this repo changing.
#
# Current now names our own theme, /usr/share/sddm/themes/dagric/. It imports
# QtQuick and nothing else, so there is no KDE QML module left that can be
# dropped from the image or renamed upstream and take the login screen with it.
#
# IF THIS THEME EVER FAILS TO LOAD, the machine is not bricked. SDDM falls back
# to its own embedded greeter and prints the QML error on screen — tested by
# breaking a copy of the theme and running the shipped greeter binary against
# it. That greeter is ugly but it logs you in, and the error tells you which
# line to look at.
#
# To get back to something presentable, change this line to Current=breeze:
# /usr/share/sddm/themes/breeze/theme.conf.user still carries the Dagric
# background and logo for exactly that reason. SDDM reads
# /etc/sddm.conf.d/*.conf in name order and the last value wins, so dropping a
# 99-fallback.conf beside this file does the same job without editing it. From
# a machine that will not reach a desktop, that edit is made from a text
# console on tty2 (Ctrl+Alt+F2) or from the live USB.
[Theme]
Current=dagric
