# Dagric OS — the login screen, for people who cannot see it well.
#
# WHAT THIS FILE CANNOT DO, STATED FIRST, BECAUSE IT IS THE IMPORTANT PART:
# there is no way to run a screen reader on SDDM's greeter. This is not a
# Dagric shortcut, it is the state of SDDM. Upstream issue #1959, "Please
# implement screen reader support", was filed by a blind user, is labelled an
# enhancement, and has no assignee, no patch and no maintainer reply; Debian
# ships 0.21.0. `man 5 sddm.conf` on the shipped package lists every option
# there is — DisplayServer, DisplayCommand, InputMethod, CursorTheme,
# CursorSize, Numlock, Autologin — and none of them start an assistive
# technology or set the greeter's environment.
#
# The obvious idea does not work either, and it is worth writing down so the
# next person does not spend a day on it. DisplayCommand
# (/usr/share/sddm/scripts/Xsetup) runs as root before the greeter starts, so
# it can launch at-spi-bus-launcher, and at-spi-bus-launcher does publish the
# bus address on the X root window as AT_SPI_BUS. But Qt does not read that
# property: `strings libQt6Gui.so.6` contains AT_SPI_BUS_ADDRESS (the
# environment variable) and never AT_SPI_BUS (the root-window property) —
# only libatspi, the client side that Orca uses, reads the property. So Orca
# would attach to a bus that the greeter never joined, and announce an empty
# desktop. Shipping that would be worse than shipping nothing, because it looks
# like the feature is there.
#
# Plasma's own Meta+Alt+S is no help before login either: it is a KGlobalAccel
# shortcut owned by kaccess, and kaccess does not exist until a session starts.
#
# WHAT DAGRIC DOES INSTEAD, in order of how much it helps:
#
#   1. The live ISO does not have this problem at all — it autologs in. That
#      is the moment a blind user decides whether Dagric is usable, and it is
#      covered: /usr/lib/dagric/a11y-live starts Orca when the machine was
#      booted from the screen-reader boot entry. See
#      0530-accessibility.hook.chroot.
#   2. On an installed machine, Orca comes back by itself at every login once
#      it has been switched on once, because kaccess reads
#      ~/.config/kaccessrc [ScreenReader] Enabled. The gap is only the password
#      prompt, not the desktop behind it.
#   3. For a single-user home machine, autologin removes the gap entirely.
#      Calamares offers it during install with its security trade-off stated.
#      It is not set here: turning autologin on for everyone by default would
#      be a security decision made on behalf of people who did not ask for it.
#
# Do not read this as "accessibility is optional here". Nothing in EN 301 549
# or Section 508 requires a pre-login screen reader; SDDM simply cannot host
# one, and pretending otherwise in a VPAT would be a false claim.
#
# What this file DOES do is the part that is achievable: make the pointer at
# the login screen the same size as the one on the desktop. A 24-pixel pointer
# on a 4K panel is genuinely hard to find, and the login screen is the first
# thing a new owner sees.
[Theme]
CursorTheme=breeze_cursors
CursorSize=32

# The on-screen keyboard, without which a touchscreen convertible cannot type a
# password and therefore cannot log in at all. qt6-virtualkeyboard-plugin is
# pinned in desktop.list.chroot alongside this — the package and the key that
# selects it are useless apart, so they were added in the same change.
#
# NOT VERIFIED ON A BUILT IMAGE, and this file's own header is the reason to say
# so plainly: it previously asserted that sddm.conf has no way to set the
# greeter's environment, which turned out to be wrong. So treat this the same
# way — the key name is what SDDM documents, but it needs a boot on a real
# touchscreen before the claim is made anywhere a customer reads it.
#
# Failure mode is benign either way: an InputMethod SDDM cannot load leaves the
# greeter exactly as it is today, keyboard-only. Nothing regresses.
[General]
InputMethod=qtvirtualkeyboard
