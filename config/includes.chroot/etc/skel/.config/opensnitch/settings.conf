# Dagric OS — the OpenSnitch prompt must not deny when nobody answers it.
#
# This is a QSettings ini file: QSettings("opensnitch", "settings") resolves to
# ~/.config/opensnitch/settings.conf, and the key "global/default_action" lands
# in the [global] group below. The OpenSnitch UI rewrites this file whenever a
# preference is changed, and QSettings does not preserve comments, so this
# explanation survives only until the owner touches Preferences. It is repeated
# in config/hooks/normal/0600-pro-edition.hook.chroot, which asserts the value.
#
# WHY. opensnitch/config.py seeds an absent global/default_action with
# ACTION_DENY_IDX. So on a fresh machine the connection prompt counts down and
# then DENIES — the "Deny (9)" seen over the Calamares window during a real Pro
# install. That contradicts two things Dagric has already committed to:
#
#   * /etc/opensnitchd/default-config.json sets DefaultAction "allow". The
#     daemon is deliberately in monitor mode so a Pro machine can never be cut
#     off by its own firewall.
#   * The manual (app-opensnitch.html) tells the owner "OpenSnitch blocks
#     nothing on its own - its default action is to allow" and that the dialog
#     "waits for you". With an unset key the dialog does not wait; it denies.
#
# Denying on a timeout is the worst of the three possible behaviours. An owner
# who steps away gets a program blocked with a rule saved for the rest of the
# session, no notification, and no obvious connection between "the printer
# stopped working" and a dialog they never saw. Allow-on-timeout matches the
# daemon, matches the manual, and leaves the owner in charge: they can still
# deny anything, and switching the whole machine to deny-by-default is the
# documented one-click step in Preferences for owners who want it.
#
# ACTION_DENY_IDX = 0, ACTION_ALLOW_IDX = 1. This file must say 1.
#
# Reaching an EXISTING home directory. /etc/skel only seeds accounts created
# after it is written, which covers the Pro ISO but not a free machine upgraded
# in place - that owner already has a home. dagric-upgrade-to-pro seeds the same
# value into every existing home, and build.sh's parity check fails if one of
# the two paths is changed without the other.
[global]
default_action=1
