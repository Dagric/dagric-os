; Dagric OS — GameMode defaults that actually do something.
;
; Debian installs upstream's example at /usr/share/gamemode/gamemode.ini, where
; renice=0 and softrealtime=off. So on a stock Pro image GameMode is installed,
; running, and achieving almost nothing beyond inhibiting the screensaver — a
; feature named in the Pro description that a buyer cannot observe.
;
; /etc beats /usr/share in GameMode's search order, so this file wins without
; editing a package-owned one, which is the mistake 0500-desktop-defaults
; documents at length about plasma-workspace.
;
; NOTE: renice requires the owner to be in the "gamemode" group. Debian does not
; add anyone to it, so this half is inert until 0600-pro-edition does — see the
; comment there. Written as configuration rather than left implicit so the two
; halves are visible together.
[general]
; How often the daemon checks whether the game is still alive, in seconds.
reaper_freq=5

; Renice the game ten levels better than everything else. Bounded on purpose:
; the reaper restores priority when the process exits, so a crashed game cannot
; leave the desktop permanently behind.
;
; The trade on a two-core machine is real — the desktop genuinely is ten nice
; levels behind the game while it runs. That is the intended behaviour for
; somebody who has just launched a game, and it is what the Pro page implies.
renice=10

; Soft realtime scheduling when the kernel supports it. "auto" asks rather than
; assumes, which is the right default when the same image runs on a ten-year-old
; laptop and a current desktop.
softrealtime=auto

; Do not switch the CPU governor here. 0250-performance deliberately refuses to
; force a governor system-wide, and dagric-game-launch holds a power profile for
; exactly as long as the game runs instead — a temporary hold that is released
; even if the game crashes, rather than a permanent setting nobody remembers.
desiredgov=

[filter]
; Left empty: no allow/deny list. A filter here is how you end up with a
; performance feature that silently does not apply to the one game somebody
; actually plays.
