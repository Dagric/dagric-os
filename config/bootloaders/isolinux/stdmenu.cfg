# Dagric OS — legacy BIOS boot menu (isolinux / vesamenu.c32).
#
# This file replaces live-build's stdmenu.cfg wholesale. menu.cfg includes it
# both at the top level and inside the Utilities submenu, so everything styled
# here applies to both, and it is included AFTER menu.cfg's own hshift/width
# lines, so the values below win.
#
# HOW CLOSE THIS GETS TO THE UEFI MENU, HONESTLY.
#
# Same art, same navy, same brand blue, same selection colour, same countdown
# wording, same hint text. Nobody sees both menus, so matching the DESIGN
# matters and matching the rendering does not — which is fortunate, because
# vesamenu cannot match the rendering:
#
#   * No rounded corners and no panel. There is no 9-slice, no alpha-composited
#     box, nothing to draw a container with. The GRUB menu's panel simply has no
#     equivalent, so this menu sits directly on the art and leans on the quiet
#     band in splash.png for contrast instead.
#   * The selection bar is a hard rectangle exactly one character cell tall, and
#     it sizes itself to the WIDEST label in the list — `menu width` does not
#     control it.
#   * Text is a fixed-cell 8x16 bitmap console font. No proportional type, no
#     antialiasing, no TTF. Everything snaps to that grid, so the menu can never
#     be optically centred against the graphic the way the GRUB one is; the rows
#     below are the nearest cell to the pixel positions the UEFI theme uses.
#   * The edit key is Tab here and E under GRUB. That is syslinux's binding, not
#     a choice, so the hint line differs by one word.
#
# Colours are #AARRGGBB. ff alpha is opaque, 00 is fully transparent — which is
# how the chrome disappears and lets splash.png through. `none` disables the
# drop shadow; every shadow here is off because a shadow under 8x16 bitmap text
# on a dark background just makes it muddy.

menu resolution 1024 768
menu background splash.png

# Geometry, in character cells: 1024x768 is 128 columns by 48 rows.
menu margin 2
menu hshift 20
menu width 88
# EIGHT, NOT FIVE, AND THE LANGUAGE SUBMENU IS WHY.
#
# This is a hard cap on rows DISPLAYED, not a hint, and it applies to submenus
# as well as the top level. The main menu has exactly five entries, so five fit
# it perfectly and the limit was invisible — until the language submenu arrived
# with six languages, a separator and a Back item, and syslinux silently drew
# the first five. Booted and confirmed: Portugues was absent, and so was the
# Back row, leaving anyone who opened that submenu with no visible way out.
#
# The border and screen colours are fully transparent above, so unused rows draw
# nothing at all — a taller allowance costs the five-entry main menu nothing.
menu rows 8
menu vshift 22
menu timeoutrow 17
menu tabmsgrow 23
menu helpmsgrow 25
menu helpmsgendrow 25
# The command line must stay clear of the rows above.
menu cmdlinerow 21

menu color screen       * #00000000 #00000000 none
menu color border       * #00000000 #00000000 none
menu color title        * #ffe8eef4 #00000000 none
# live-build never set `unsel` at all, so unselected entries were drawn in
# syslinux's built-in default rather than in any Dagric colour.
menu color unsel        * #ffa9bdd6 #00000000 none
menu color hotkey       * #ffffffff #00000000 none
menu color sel          * #ffffffff #ff3fa9f5 none
menu color hotsel       * #ffffffff #ff3fa9f5 none
menu color disabled     * #ff5d6f86 #00000000 none
menu color scrollbar    * #00000000 #00000000 none
menu color tabmsg       * #ff68809b #00000000 none
menu color timeout_msg  * #ff68809b #00000000 none
menu color timeout      * #ffeaf2ff #00000000 none
menu color help         * #ff5d6f86 #00000000 none
menu color cmdmark      * #ff3fa9f5 #00000000 none
menu color cmdline      * #ffe8eef4 #00000000 none
menu color msg07        * #ffa9bdd6 #00000000 none

# `#` is replaced with the seconds remaining, drawn in the `timeout` colour
# while the words around it use `timeout_msg` — a two-tone countdown for free.
# syslinux can pluralise this with a {,s} construct and GRUB cannot, so both
# paths use the short form and say exactly the same thing.
menu autoboot Starting Dagric OS in #s
menu tabmsg Enter to start        Up / Down to choose        Tab to edit
