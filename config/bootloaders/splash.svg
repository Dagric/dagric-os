<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e1826"/>
      <stop offset="55%" stop-color="#0a111c"/>
      <stop offset="100%" stop-color="#05080d"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="18%" r="50%">
      <stop offset="0%" stop-color="#18293d"/>
      <stop offset="100%" stop-color="#18293d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3fa9f5"/>
      <stop offset="100%" stop-color="#7be0c8"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3fa9f5" stop-opacity="0"/>
      <stop offset="50%" stop-color="#3fa9f5" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7be0c8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="contour" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3fa9f5" stop-opacity="0"/>
      <stop offset="45%" stop-color="#3fa9f5" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#7be0c8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="640" height="480" fill="url(#bg)"/>
  <rect width="640" height="480" fill="url(#glow)"/>

  <!-- D monogram in a fine keyline ring -->
  <g transform="translate(320,86)">
    <circle r="38" fill="none" stroke="#243850" stroke-width="1"/>
    <circle r="38" fill="none" stroke="url(#mark)" stroke-width="1" opacity="0.25"/>
    <path transform="translate(-3,0)"
          d="M -14 -20 H 0 A 20 20 0 0 1 0 20 H -14 Z M -6 -12 H 0 A 12 12 0 0 1 0 12 H -6 Z"
          fill="url(#mark)" fill-rule="evenodd"/>
  </g>

  <!-- Wordmark and tagline -->
  <g font-family="DejaVu Sans" text-anchor="middle">
    <text x="329" y="170" font-size="32" letter-spacing="18" fill="#e8eef4">DAGRIC</text>
    <text x="323" y="196" font-size="11" letter-spacing="6" fill="#6d8196">OWN IT OUTRIGHT</text>
  </g>
  <rect x="240" y="214" width="160" height="1" fill="url(#hair)"/>

  <!-- Quiet horizon contours, kept clear of menu and help text -->
  <g stroke="url(#contour)" fill="none" stroke-width="1.25">
    <path d="M -20 408 Q 190 372 350 392 T 660 376" opacity="0.20"/>
    <path d="M -20 432 Q 210 400 380 418 T 660 404" opacity="0.12"/>
    <path d="M -20 456 Q 230 428 410 444 T 660 432" opacity="0.07"/>
  </g>
</svg>
