<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="system-ui,sans-serif">
  <!--
    WHAT THIS DIAGRAM USED TO SHOW, AND WHY IT WAS WRONG.

    It drew Horizon's lower panel as a macOS-style floating dock: rect x=170
    y=352 width=300 rx=14, i.e. centred, 47% of the screen width, with rounded
    corners — and with a launcher as its first icon.

    horizon.look builds none of that:

        var d = new Panel;
        d.location = "bottom";
        d.height   = Math.round(gridUnit * 3);
        d.addWidget("org.kde.plasma.icontasks");

    A Plasma panel spans its whole edge unless something sets alignment,
    lengthMode or floating, and that script sets none of them — a grep across
    all seven .look files finds no such property anywhere. So the real Horizon
    lower panel is a FULL-WIDTH, square-cornered bar. It is also the thickest
    panel in the entire set at 3.0 grid units, and this file drew it 40px, the
    same as classic.look's 2.2 — flattening the one layout whose selling point
    is a generous dock.

    And the launcher was not there to draw. horizon.look puts kickoff on the
    TOP panel; the bottom panel gets icontasks and nothing else. The first icon
    below is therefore a task button like the rest, not the D mark.

    The repo's own thumbnail generator had this right all along —
    tools/make-appearance-thumbs.sh:290 draws `rectangle 0,236 480,270`, full
    width and square, with no accent icon on it. So the in-OS picture and the
    website picture of the same layout disagreed, and the website was the wrong
    one. That matters more than a normal diagram bug because Horizon is a PRO
    layout: somebody pays $39 partly for this and gets a full-width bar.

    Heights here are proportional to the .look multipliers against this 400px
    canvas at ~11.6px per grid unit: top 1.6gu -> 19px, bottom 3.0gu -> 35px.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101b2c"/><stop offset="1" stop-color="#0a1420"/>
    </linearGradient>
    <linearGradient id="d" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#59c2e8"/><stop offset="1" stop-color="#2f7fd1"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#bg)"/>
  <path d="M0 300 Q 200 270 400 295 T 640 285" fill="none" stroke="#3fa9f5" stroke-opacity=".22" stroke-width="1.5"/>
  <path d="M0 325 Q 220 300 430 320 T 640 310" fill="none" stroke="#3fa9f5" stroke-opacity=".12" stroke-width="1.5"/>
  <text x="320" y="180" text-anchor="middle" fill="url(#d)" font-size="60" font-weight="800">D</text>
  <rect x="294" y="190" width="52" height="4" rx="2" fill="#3fa9f5" opacity=".6"/>
  <!-- top panel: 1.6gu. kickoff, appmenu, spacer, systemtray, digitalclock -->
  <rect x="0" y="0" width="640" height="19" fill="#eef1f4"/>
  <rect x="6" y="3" width="14" height="13" rx="4" fill="url(#d)"/>
  <text x="13" y="13" text-anchor="middle" fill="#fff" font-size="9" font-weight="800">D</text>
  <rect x="28" y="6" width="30" height="7" rx="2" fill="#c9d3dc"/>
  <rect x="64" y="6" width="22" height="7" rx="2" fill="#dde3e9"/>
  <rect x="92" y="6" width="22" height="7" rx="2" fill="#dde3e9"/>
  <circle cx="580" cy="9.5" r="3" fill="#8794a1"/><circle cx="568" cy="9.5" r="3" fill="#8794a1"/>
  <text x="600" y="13" fill="#31363b" font-size="9">7:17</text>
  <!-- bottom panel: 3.0gu, full width, square. icontasks only — no launcher. -->
  <rect x="0" y="365" width="640" height="35" fill="#eef1f4"/>
  <rect x="12" y="371" width="24" height="24" rx="6" fill="#c9d3dc"/>
  <rect x="44" y="371" width="24" height="24" rx="6" fill="#c9d3dc"/>
  <rect x="76" y="371" width="24" height="24" rx="6" fill="#c9d3dc"/>
  <rect x="108" y="371" width="24" height="24" rx="6" fill="#c9d3dc"/>
  <rect x="140" y="371" width="24" height="24" rx="6" fill="#c9d3dc"/>
</svg>
