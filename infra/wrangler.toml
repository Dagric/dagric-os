# Dagric OS — deploy config for the two Cloudflare Workers.
#
# WHY THIS FILE EXISTS, AND WHY IT IS NOT OPTIONAL. Both workers were first
# uploaded through the Cloudflare API by hand, so nothing in git described their
# bindings. That is fine until the day somebody edits a worker and runs
# `wrangler deploy` — because a deploy REPLACES the script and its binding set
# with whatever the config declares, and a config that declares no R2 bucket
# removes the one the live worker has.
#
# For dagric-gate that is not a cosmetic failure. `env.PRO` is the private
# bucket holding the Pro ISO; lose the binding and every paying customer's
# download link starts throwing, with no error anywhere until somebody
# complains. The gate worker's pending change is a RESTYLE of its error page —
# so the downside of a careless deploy is orders of magnitude larger than the
# upside of the deploy itself. Declaring the bindings here is what makes the
# deploy safe to run.
#
# SECRETS ARE NOT DECLARED HERE AND MUST NOT BE. `STRIPE_KEY` is a Worker
# secret, set once with `wrangler secret put STRIPE_KEY --name dagric-gate`.
# Secrets survive a deploy; bindings declared in config do not survive being
# omitted from it. Never paste the Stripe key into this file — it is committed.
#
# BEFORE THE FIRST DEPLOY THROUGH WRANGLER, confirm the live bindings match what
# is written below, because this file was reconstructed from infra/README.md and
# the worker source rather than exported from Cloudflare:
#
#     wrangler deployments list --name dagric-gate
#     wrangler secret list --name dagric-gate      # expect STRIPE_KEY
#
# Then, and only then:
#
#     wrangler deploy --config infra/wrangler.toml
#
# Verify immediately afterwards that the paid path still works — a 400 from the
# root is correct and expected, a 500 is the binding being gone:
#
#     curl -si https://dagric-gate.dagric.workers.dev/ | head -1        # 400
#     curl -si 'https://dagric-gate.dagric.workers.dev/?session_id=cs_test_x' | head -1

name = "dagric-gate"
main = "gate-worker.js"
compatibility_date = "2026-01-01"

# The PRIVATE bucket. dagric-downloads is the PUBLIC one and holds only the free
# ISO and the checksums; the Pro ISO must never be placed there, which is the
# entire reason this worker exists.
[[r2_buckets]]
binding = "PRO"
bucket_name = "dagric-pro"

# The licence-allowance store: one machine per purchase, ISO download starts,
# and the legacy assets counter. The worker FAILS OPEN if this binding is
# missing or KV errors — customers are never locked out by our storage — so a
# careless deploy without it degrades to "no allowance enforcement", loudly
# visible in `wrangler deployments list`, rather than to broken downloads.
#
# BEFORE THE FIRST DEPLOY: create the namespace and paste its id here —
#     wrangler kv namespace create LICENSE
# (Blocked until the Cloudflare token is rotated; the placeholder below makes
# `wrangler deploy` fail rather than silently deploy without the binding.)
[[kv_namespaces]]
binding = "LICENSE"
id = "CREATE-WITH-wrangler-kv-namespace-create-LICENSE"

# A KV counter cannot HARD-stop a deliberate parallel burst — read-modify-write
# is not atomic and KV is eventually consistent, so a scripted fan-out on one
# leaked session can overshoot every budget in the worker. The worker's budgets
# are the backstop; the THROTTLE is a Cloudflare rate-limiting rule on this
# route, which must be added in the dashboard once (it is not expressible here):
#
#   Security -> WAF -> Rate limiting rules, on dagric-gate.dagric.workers.dev:
#     match:  URI Query contains "session_id="
#     count:  by the session_id value if available, else client IP
#     limit:  ~60 requests / 10s  ->  Block (or Managed Challenge)
#
# Sixty requests in ten seconds is far above a browser resuming a download or
# the upgrade tool's handful of calls, and far below what a distribution script
# needs. The gated payload is free software either way, so this protects egress,
# not a sale — do not over-tune it into blocking a real customer on hotel Wi-Fi.

# ── the contact-form backend ────────────────────────────────────────────────
# Deployed separately:  wrangler deploy --config infra/wrangler.toml --env contact
# It has no secrets. Its R2 bucket is where /contact messages land, read from
# the Cloudflare dashboard under R2 -> dagric-contact -> inbox/.
[env.contact]
name = "dagric-contact"
main = "contact-worker.js"

[[env.contact.r2_buckets]]
binding = "MAIL"
bucket_name = "dagric-contact"

# RATE LIMITING FOR THE CONTACT ENDPOINT, IN THE REPO RATHER THAN THE DASHBOARD.
#
# The rate-limit note further up scopes its WAF rule to dagric-gate only, so this
# endpoint had no throttle of any kind: no limit, no challenge, and only a
# honeypot field that anything other than a browser skips. Unlike the gate's
# rule, this one is declared here — which means it is reviewable, it deploys with
# the worker, and it cannot be silently absent because somebody forgot a manual
# step in a console.
#
# Five posts per minute per IP. A person filling in a support form sends one; the
# limit exists to stop a script, not to ration honest use, so it is set well
# above any real usage rather than tightly. The worker degrades safely if this
# binding is missing — see the comment at the check itself.
#
# namespace_id is a per-account identifier for the limiter, not a secret.
[[env.contact.unsafe.bindings]]
name = "RATE_LIMIT"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 5, period = 60 }
