name: source-quality

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: source-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Source and privilege-boundary sanity
        run: |
          python3 tools/check-source.py
          python3 test/test-build-directory.py
          python3 test/test-audit-all-modes.py
      - name: Offline manual and icon-family coverage
        run: |
          python3 tools/check-manual-coverage.py
          python3 test/test-manual-coverage.py
          python3 tools/check-icon-themes.py
      - name: Licensing and media-rights baseline
        run: |
          python3 tools/check-release-rights.py
          python3 tools/check-game-platform-policy.py
          python3 test/test-generate-exact-source-map.py
          python3 test/test-source-map-gate.py
          python3 test/test-private-r2-staging.py
      - name: Product concept contracts and negative-path tests
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq python3-yaml xorriso squashfs-tools
          python3 tools/check-concepts.py
          python3 test/test-source-check.py
          python3 test/test-migrate-browser-security.py
          python3 test/test-migrate-continuity-privacy.py
          python3 test/test-private-state-writes.py
          sudo python3 test/test-opensnitch-boundary.py
          sudo python3 test/test-opensnitch-package.py
          python3 test/test-opensnitch-calamares.py
          python3 test/test-security-artifacts.py
          python3 test/test-installed-audit.py
          python3 test/test-candidate-security-audit.py
          python3 test/test-embedded-sources.py
          python3 test/test-source-bundle.py
          python3 test/test-source-candidate-lock.py
          python3 test/test-dsc-signatures.py
          python3 test/test-source-bundle-images.py
          python3 test/test-source-evidence-integration.py
          python3 test/test-firstrun-scale.py
          python3 test/test-source-completeness-guards.py
      - name: JavaScript syntax
        run: sh tools/check-javascript.sh
      - name: Worker security-boundary tests
        run: node test/test-workers.mjs
      - name: Marketing discovery never authorizes submission
        run: node --test test/test-marketing-opportunity-discovery.mjs
      - name: Production dependency vulnerabilities
        run: sh tools/check-dependencies.sh
      - name: Dockerfile sanity
        run: sh tools/check-dockerfile.sh
      - name: Site release sanity
        run: sh tools/check-site.sh
      - name: Rewind unit and privilege-boundary checks
        run: sh tools/check-rewind.sh
      - name: Install source verifiers
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gettext shellcheck
      - name: Shell syntax and error-level analysis
        run: sh tools/check-shell.sh
      - name: Translation catalogues match their sources
        run: |
          sh tools/i18n-build.sh --check
          python3 tools/i18n-wizard.py --check

  desktop-interface:
    runs-on: ubuntu-latest
    # Test Debian 13's Qt, not the older Qt shipped by the Ubuntu CI host.
    container: debian:trixie@sha256:fac46bff2e02f51425b6e33b0e1169f55dfb053d83511ca28aa50c09fd5ed7a4
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Dagric's Qt runtime and type metadata
        run: |
          apt-get update -qq
          apt-get install -y -qq python3 xvfb xauth qt6-declarative-dev qt6-declarative-dev-tools qml6-module-qtquick qml6-module-qtqml qml6-module-qttest qml6-module-qtquick-controls qml6-module-qtquick-layouts qml6-module-qtquick-window qml6-module-qtquick-templates qml6-module-qtqml-workerscript
      - name: First-run screen-fit and recovery interface checks
        run: |
          mkdir -p out
          QT_QPA_PLATFORM=xcb QT_QUICK_BACKEND=software QT_QUICK_CONTROLS_STYLE=Basic xvfb-run -a /usr/lib/qt6/bin/qmltestrunner -input test/qml -o -,txt
          sh tools/check-rewind.sh
