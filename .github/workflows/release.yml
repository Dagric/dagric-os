# Dagric OS — commercial release candidate pipeline. A version tag builds both
# editions, but no bytes leave the runner until the exact built artifact passes
# the source, package, proprietary-client and human legal/trademark gates.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v* tag that points at the selected revision
        required: true
        type: string

env:
  CANDIDATE_RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

permissions:
  contents: read

jobs:
  # Tags bypass build-iso.yml's main-branch trigger. Re-run every cheap gate
  # here so a tag cannot publish source that would have failed the normal
  # preflight. The expensive package-resolution gate still runs inside each
  # edition's container build against the same Debian archive used by the ISO.
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ env.CANDIDATE_RELEASE_TAG }}
      - name: Bind this run to an existing release tag and commit
        run: |
          set -eu
          printf '%s\n' "$CANDIDATE_RELEASE_TAG" | \
            grep -Eq '^v[0-9][0-9A-Za-z._-]*$' || {
              echo "::error::commercial releases require a simple v* tag"
              exit 1
            }
          TAG_COMMIT=$(git rev-parse "refs/tags/$CANDIDATE_RELEASE_TAG^{commit}")
          HEAD_COMMIT=$(git rev-parse HEAD)
          if [ "$TAG_COMMIT" != "$HEAD_COMMIT" ]; then
            echo "::error::$CANDIDATE_RELEASE_TAG points at $TAG_COMMIT, not $HEAD_COMMIT"
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_SHA" != "$HEAD_COMMIT" ]; then
            echo "::error::GitHub candidate identity differs from checked-out HEAD"
            exit 1
          fi
          test -z "$(git status --porcelain --untracked-files=all)" || {
            echo "::error::commercial release checkout is dirty"
            exit 1
          }
          SOURCE_COMMIT=$(python3 -c \
            'import json; print(json.load(open("site/manifest/release.json"))["source"]["commit"])')
          git cat-file -e "$SOURCE_COMMIT^{commit}"
          git merge-base --is-ancestor "$SOURCE_COMMIT" "$HEAD_COMMIT" || {
            echo "::error::recorded build source is not an ancestor of the release tag"
            exit 1
          }
          # The later tag commit is allowed to freeze candidate records only.
          # Any OS, build, policy, artwork or checker change belongs in the
          # earlier source commit and therefore changes the artifact being built.
          BAD_DELTA=$(git diff --name-only "$SOURCE_COMMIT..$HEAD_COMMIT" | \
            grep -Ev '^(site/manifest/(release\.json|source-index-[0-9.]+\.json|dagric-os(-pro)?-[0-9.]+\.packages)|docs/RELEASE-[A-Za-z0-9._-]+\.md)$' || true)
          if [ -n "$BAD_DELTA" ]; then
            echo "::error::tag commit changes build-affecting files after recorded source commit:"
            printf '%s\n' "$BAD_DELTA"
            exit 1
          fi
      - name: Source and privilege-boundary sanity
        run: python3 tools/check-source.py
      - name: Offline manual and icon-family coverage
        run: |
          python3 tools/check-manual-coverage.py
          python3 tools/check-icon-themes.py
      - name: Browser migration privacy
        run: |
          python3 test/test-migrate-browser-security.py
          python3 test/test-migrate-continuity-privacy.py
      - name: Licensing and media-rights baseline
        run: |
          python3 tools/check-release-rights.py
          python3 tools/check-game-platform-policy.py
          python3 test/test-commercial-release-gate.py
          python3 test/test-physical-release-gate.py
          python3 test/test-release-locales.py
          python3 test/test-private-r2-staging.py
          python3 test/test-release-workflow-gate.py
      - name: JavaScript syntax
        run: sh tools/check-javascript.sh
      - name: Worker security-boundary tests
        run: node test/test-workers.mjs
      - name: Production dependency vulnerabilities
        run: sh tools/check-dependencies.sh
      - name: Dockerfile sanity
        run: sh tools/check-dockerfile.sh
      - name: Site release sanity
        run: sh tools/check-site.sh
      - name: Rewind unit and privilege-boundary checks
        run: sh tools/check-rewind.sh
      - name: Install source verifiers
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gettext shellcheck
      - name: Shell syntax and error-level analysis
        run: sh tools/check-shell.sh
      - name: Translation catalogues match their sources
        run: sh tools/i18n-build.sh --check

  build:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 300
    # Configure this environment with required human reviewers and the
    # COMMERCIAL_RELEASE_APPROVAL_JSON secret documented below. The artifact
    # checker still validates that attestation against this exact tag/commit.
    environment: commercial-release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ env.CANDIDATE_RELEASE_TAG }}

      - name: Check out the immutable source recorded by the release
        run: |
          set -eu
          SOURCE_COMMIT=$(python3 -c \
            'import json; print(json.load(open("site/manifest/release.json"))["source"]["commit"])')
          git cat-file -e "$SOURCE_COMMIT^{commit}"
          git merge-base --is-ancestor "$SOURCE_COMMIT" HEAD
          git clone --no-hardlinks --quiet "$GITHUB_WORKSPACE" candidate-source
          git -C candidate-source checkout --quiet --detach "$SOURCE_COMMIT"
          test "$(git -C candidate-source rev-parse HEAD)" = "$SOURCE_COMMIT"
          test -z "$(git -C candidate-source status --porcelain --untracked-files=all)"

      # THE PRO BUILD RAN OUT OF DISK, AND ONLY THE PRO BUILD.
      #
      # ubuntu-latest gives roughly 14 GB free on /. Free fits and produced a
      # 2.1 GB ISO; Pro does not — i386 multiarch, wine32, the full LibreOffice,
      # Blender and OBS make a much larger chroot, and it died compressing the
      # initramfs:
      #
      #     zstd: error 70 : Write error : cannot write block : No space left
      #     E: mkinitramfs failure zstd -q -9 70
      #
      # which surfaced as "0700-plymouth.hook.chroot failed" — a hook that was
      # working perfectly and simply had nowhere to write.
      #
      # The runner ships ~30 GB of toolchains a Debian live-build never touches:
      # .NET, the Android SDK, GHC, Swift, PowerShell, the hosted tool cache.
      # Removing them costs seconds and roughly triples the space available.
      # Printed before and after so a future disk failure is one glance away
      # rather than four hundred lines into a log.
      - name: Reclaim runner disk
        run: |
          echo "before:"; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/share/swift \
                      /usr/local/share/powershell "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          echo "after:"; df -h / | tail -1

      # Both editions stay on this runner until both pass. Separate matrix jobs
      # cannot share 2-4 GB ISOs without first uploading them, which would let
      # one edition leave the runner before the other had been audited.
      - name: Build both candidate ISOs
        run: |
          set -eu
          SOURCE_COMMIT=$(git -C candidate-source rev-parse HEAD)
          docker build -t dagric-builder candidate-source/docker/
          mkdir -p out
          for EDITION in free pro; do
            docker run --rm --privileged \
              -e EDITION="$EDITION" \
              -e DAGRIC_SOURCE_COMMIT="$SOURCE_COMMIT" \
              -e DAGRIC_RELEASE_BUILD=1 \
              -v "$PWD/candidate-source:/src:ro" -v "$PWD/out:/out" \
              dagric-builder sh /src/docker/container-build.sh
          done

      # THE ISO FILENAME IS THE PRODUCT VERSION, NOT THE TAG, and that is not a
      # detail — it is a live link.
      #
      # This used to name the image from the tag (dagric-os-1.4-amd64.iso for
      # v1.4). site/download.html links to dagric-os-1.0-amd64.iso and the signed
      # SHA256SUMS covers that same name, so a tag-named upload would have left
      # the download button pointing at an object that does not exist. The
      # product version is "1.0 (Foundation)" in os-release and stays there; the
      # v1.x tags are release milestones, not user-facing version bumps.
      #
      # Overwriting the same key on each release is deliberate: the download URL
      # is stable and printed on the site, and the signature is what tells a
      # buyer which build they have.
      # The naming moved INTO container-build.sh, which now derives the ISO
      # name from $EDITION instead of handing back live-build's own
      # live-image-amd64.hybrid.iso for both editions. Left as `mv out/*.iso
      # "out/dagric-os-...iso"` this became a same-file mv the moment that
      # landed — GNU mv reports "are the same file" and exits 1, which would
      # fail the release job on a build that had just succeeded. So this step
      # checks the name instead of setting it, and still stops the release if
      # the ISO is not the one the R2 upload below is about to ask for.
      - name: Check both ISO names
        run: |
          VERSION=$(python3 -c \
            'import json; print(json.load(open("site/manifest/release.json"))["version"])')
          for WANT in \
            "out/dagric-os-$VERSION-amd64.iso" \
            "out/dagric-os-pro-$VERSION-amd64.iso"; do
            if [ ! -f "$WANT" ]; then
              echo "::error::expected $WANT — container-build.sh produced:"
              ls -l out/
              exit 1
            fi
          done
          ls -lh out/*.iso

      # Source-tree package lists cannot prove what live-build resolved. Read
      # the immutable filesystem.packages from the candidate ISO, then bind its
      # bytes, package inventory and build provenance to the complete source map
      # and the protected human approval. This step must remain before every
      # network upload in this job.
      - name: Hard-gate the built commercial candidate
        env:
          COMMERCIAL_RELEASE_APPROVAL_JSON: ${{ secrets.COMMERCIAL_RELEASE_APPROVAL_JSON }}
        run: |
          set -eu
          python3 tools/check-release-locales.py --root candidate-source
          sudo apt-get update -qq
          sudo apt-get install -y -qq xorriso
          VERSION=$(python3 -c \
            'import json; print(json.load(open("site/manifest/release.json"))["version"])')
          SOURCE_COMMIT=$(git -C candidate-source rev-parse HEAD)
          for EDITION in free pro; do
            if [ "$EDITION" = pro ]; then
              ISO="out/dagric-os-pro-$VERSION-amd64.iso"
              MANIFEST="out/dagric-os-pro-$VERSION.packages"
            else
              ISO="out/dagric-os-$VERSION-amd64.iso"
              MANIFEST="out/dagric-os-$VERSION.packages"
            fi
            xorriso -osirrox on -indev "$ISO" \
              -extract /live/filesystem.packages "$MANIFEST"
            python3 tools/check-commercial-release.py edition \
              --edition "$EDITION" \
              --iso "$ISO" \
              --package-manifest "$MANIFEST" \
              --package-sections "out/PACKAGE_SECTIONS-$EDITION.tsv" \
              --provenance "out/SOURCE_COMMIT-$EDITION" \
              --checksums out/SHA256SUMS \
              --candidate-commit "$SOURCE_COMMIT" \
              --release-tag "$CANDIDATE_RELEASE_TAG" \
              --candidate-source-root candidate-source \
              --firefox-policy candidate-source/config/includes.chroot/usr/lib/firefox-esr/distribution/policies.json \
              --game-policy candidate-source/config/includes.chroot/usr/share/dagric/policy/game-integrations.json
          done
          python3 tools/check-commercial-release.py promotion \
            --checksums out/SHA256SUMS \
            --free-manifest "out/dagric-os-$VERSION.packages" \
            --pro-manifest "out/dagric-os-pro-$VERSION.packages" \
            --free-package-sections out/PACKAGE_SECTIONS-free.tsv \
            --pro-package-sections out/PACKAGE_SECTIONS-pro.tsv \
            --free-iso "out/dagric-os-$VERSION-amd64.iso" \
            --pro-iso "out/dagric-os-pro-$VERSION-amd64.iso" \
            --free-provenance out/SOURCE_COMMIT-free \
            --pro-provenance out/SOURCE_COMMIT-pro \
            --candidate-commit "$SOURCE_COMMIT" \
            --release-tag "$CANDIDATE_RELEASE_TAG" \
            --candidate-source-root candidate-source \
            --firefox-policy candidate-source/config/includes.chroot/usr/lib/firefox-esr/distribution/policies.json \
            --game-policy candidate-source/config/includes.chroot/usr/share/dagric/policy/game-integrations.json \
            --authorization-output out/COMMERCIAL-RELEASE-AUTHORIZATION.json

      # UPLOAD STRAIGHT TO R2 INSTEAD OF THROUGH ARTIFACTS.
      #
      # v1.4 built both editions perfectly and then threw them away:
      #     Failed to CreateArtifact: Artifact storage quota has been hit.
      # The build step is continue-on-error (correctly — a storage problem is not
      # a build failure), so the jobs went green, the publish job found zero
      # artifacts, and the release produced nothing. A ~2 GB free ISO and a
      # ~3.9 GB Pro ISO will not fit an artifact quota on any plan this project
      # is on, so the round trip through artifacts can never work here.
      #
      # A dedicated private R2 bucket avoids the artifact quota without exposing
      # an unsigned, guessable candidate through the public download bucket.
      #
      # AWS_REQUEST_CHECKSUM_CALCULATION: newer aws-cli v2 adds integrity headers
      # that R2's S3 layer rejects; "when_required" keeps it to what R2 accepts.
      - name: Upload gated candidate to R2 staging
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          R2_ACCOUNT: ${{ secrets.R2_ACCOUNT_ID }}
          STAGING_BUCKET: ${{ secrets.R2_STAGING_BUCKET }}
          CLOUDFLARE_R2_AUDIT_TOKEN: ${{ secrets.CLOUDFLARE_R2_AUDIT_TOKEN }}
        run: |
          set -e
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$R2_ACCOUNT" ] || \
             [ -z "$STAGING_BUCKET" ]; then
            echo "::error::R2 secrets are not configured. Add R2_ACCOUNT_ID,"
            echo "::error::R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY and R2_STAGING_BUCKET."
            exit 1
          fi
          python3 tools/check-private-r2-staging.py \
            --account "$R2_ACCOUNT" --bucket "$STAGING_BUCKET"
          EP="https://${R2_ACCOUNT}.r2.cloudflarestorage.com"
          VERSION=$(python3 -c \
            'import json; print(json.load(open("site/manifest/release.json"))["version"])')
          # STAGING, NOT THE LIVE KEY. This is the whole safety of the release.
          #
          # The live objects are what dagric.com/download serves right now, and
          # SHA256SUMS.sig beside them signs THOSE bytes. Overwriting the ISO and
          # SHA256SUMS here while that old signature is still in place would make
          # `gpg --verify` fail for every visitor — not "unsigned", but BAD
          # SIGNATURE, which reads as a tampered download and is worse than
          # shipping nothing. The signature is produced by hand, off this runner,
