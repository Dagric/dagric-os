          COMMERCIAL_RELEASE_APPROVAL_JSON: ${{ secrets.COMMERCIAL_RELEASE_APPROVAL_JSON }}
        run: |
          set -eu
          python3 tools/check-release-locales.py --root candidate-source
          sudo apt-get update -qq
          sudo apt-get install -y -qq xorriso
          VERSION=$(python3 -c \
            'import json; print(json.load(open("site/manifest/release.json"))["version"])')
          SOURCE_COMMIT=$(git -C candidate-source rev-parse HEAD)
          for EDITION in free pro; do
            if [ "$EDITION" = pro ]; then
              ISO="out/dagric-os-pro-$VERSION-amd64.iso"
              MANIFEST="out/dagric-os-pro-$VERSION.packages"
            else
              ISO="out/dagric-os-$VERSION-amd64.iso"
              MANIFEST="out/dagric-os-$VERSION.packages"
            fi
            xorriso -osirrox on -indev "$ISO" \
              -extract /live/filesystem.packages "$MANIFEST"
            python3 tools/check-commercial-release.py edition \
              --edition "$EDITION" \
              --iso "$ISO" \
              --package-manifest "$MANIFEST" \
              --package-sections "out/PACKAGE_SECTIONS-$EDITION.tsv" \
              --provenance "out/SOURCE_COMMIT-$EDITION" \
              --checksums out/SHA256SUMS \
              --candidate-commit "$SOURCE_COMMIT" \
              --release-tag "$CANDIDATE_RELEASE_TAG" \
              --candidate-source-root candidate-source \
              --firefox-policy candidate-source/config/includes.chroot/usr/lib/firefox-esr/distribution/policies.json \
              --game-policy candidate-source/config/includes.chroot/usr/share/dagric/policy/game-integrations.json
          done
          python3 tools/check-commercial-release.py promotion \
            --checksums out/SHA256SUMS \
            --free-manifest "out/dagric-os-$VERSION.packages" \
            --pro-manifest "out/dagric-os-pro-$VERSION.packages" \
            --free-package-sections out/PACKAGE_SECTIONS-free.tsv \
            --pro-package-sections out/PACKAGE_SECTIONS-pro.tsv \
            --free-iso "out/dagric-os-$VERSION-amd64.iso" \
            --pro-iso "out/dagric-os-pro-$VERSION-amd64.iso" \
            --free-provenance out/SOURCE_COMMIT-free \
            --pro-provenance out/SOURCE_COMMIT-pro \
            --candidate-commit "$SOURCE_COMMIT" \
            --release-tag "$CANDIDATE_RELEASE_TAG" \
            --candidate-source-root candidate-source \
            --firefox-policy candidate-source/config/includes.chroot/usr/lib/firefox-esr/distribution/policies.json \
            --game-policy candidate-source/config/includes.chroot/usr/share/dagric/policy/game-integrations.json \
            --authorization-output out/COMMERCIAL-RELEASE-AUTHORIZATION.json

      # UPLOAD STRAIGHT TO R2 INSTEAD OF THROUGH ARTIFACTS.
      #
      # v1.4 built both editions perfectly and then threw them away:
      #     Failed to CreateArtifact: Artifact storage quota has been hit.
      # The build step is continue-on-error (correctly — a storage problem is not
      # a build failure), so the jobs went green, the publish job found zero
      # artifacts, and the release produced nothing. A ~2 GB free ISO and a
      # ~3.9 GB Pro ISO will not fit an artifact quota on any plan this project
      # is on, so the round trip through artifacts can never work here.
      #
      # A dedicated private R2 bucket avoids the artifact quota without exposing
      # an unsigned, guessable candidate through the public download bucket.
      #
      # AWS_REQUEST_CHECKSUM_CALCULATION: newer aws-cli v2 adds integrity headers
      # that R2's S3 layer rejects; "when_required" keeps it to what R2 accepts.
      - name: Upload gated candidate to R2 staging
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          R2_ACCOUNT: ${{ secrets.R2_ACCOUNT_ID }}
          STAGING_BUCKET: ${{ secrets.R2_STAGING_BUCKET }}
          CLOUDFLARE_R2_AUDIT_TOKEN: ${{ secrets.CLOUDFLARE_R2_AUDIT_TOKEN }}
        run: |
          set -e
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$R2_ACCOUNT" ] || \
             [ -z "$STAGING_BUCKET" ]; then
            echo "::error::R2 secrets are not configured. Add R2_ACCOUNT_ID,"
            echo "::error::R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY and R2_STAGING_BUCKET."
            exit 1
          fi
          python3 tools/check-private-r2-staging.py \
            --account "$R2_ACCOUNT" --bucket "$STAGING_BUCKET"
          EP="https://${R2_ACCOUNT}.r2.cloudflarestorage.com"
          VERSION=$(python3 -c \
            'import json; print(json.load(open("site/manifest/release.json"))["version"])')
          # STAGING, NOT THE LIVE KEY. This is the whole safety of the release.
          #
          # The live objects are what dagric.com/download serves right now, and
          # SHA256SUMS.sig beside them signs THOSE bytes. Overwriting the ISO and
          # SHA256SUMS here while that old signature is still in place would make
          # `gpg --verify` fail for every visitor — not "unsigned", but BAD
          # SIGNATURE, which reads as a tampered download and is worse than
          # shipping nothing. The signature is produced by hand, off this runner,
          # so CI cannot close that window itself.
          #
          # Publishing is therefore a separate, deliberate copy AFTER the new
          # SHA256SUMS has been signed. See the job summary for the two commands.
          for EDITION in free pro; do
            if [ "$EDITION" = pro ]; then
              ISO="dagric-os-pro-$VERSION-amd64.iso"
              MANIFEST="dagric-os-pro-$VERSION.packages"
            else
              ISO="dagric-os-$VERSION-amd64.iso"
              MANIFEST="dagric-os-$VERSION.packages"
            fi
            ISO_SHA=$(sha256sum "out/$ISO" | cut -d' ' -f1)
            SOURCE_COMMIT=$(cat "out/SOURCE_COMMIT-$EDITION")
            PREFIX="staging/$CANDIDATE_RELEASE_TAG/$SOURCE_COMMIT"
            echo "Uploading $ISO -> private candidate bucket $PREFIX/"
            aws s3 cp "out/$ISO" "s3://$STAGING_BUCKET/$PREFIX/$ISO" \
              --metadata "sha256=$ISO_SHA,source-commit=$SOURCE_COMMIT,release-tag=$CANDIDATE_RELEASE_TAG" \
              --endpoint-url "$EP" --only-show-errors
            ( cd out && sha256sum "$ISO" > "$ISO.sha256" )
            aws s3 cp "out/$ISO.sha256" "s3://$STAGING_BUCKET/$PREFIX/checksums/$ISO.sha256" \
              --endpoint-url "$EP" --only-show-errors
            aws s3 cp "out/$MANIFEST" "s3://$STAGING_BUCKET/$PREFIX/manifest/$MANIFEST" \
              --endpoint-url "$EP" --only-show-errors
            aws s3 cp "out/PACKAGE_SECTIONS-$EDITION.tsv" \
              "s3://$STAGING_BUCKET/$PREFIX/manifest/PACKAGE_SECTIONS-$EDITION.tsv" \
              --endpoint-url "$EP" --only-show-errors
            echo "### $EDITION gated and staged" >> "$GITHUB_STEP_SUMMARY"
            cat "out/$ISO.sha256" >> "$GITHUB_STEP_SUMMARY"
          done
          aws s3 cp out/COMMERCIAL-RELEASE-AUTHORIZATION.json \
            "s3://$STAGING_BUCKET/$PREFIX/manifest/COMMERCIAL-RELEASE-AUTHORIZATION.json" \
            --endpoint-url "$EP" --only-show-errors

      # NO ARTIFACT UPLOAD. Both ISOs are in a private R2 candidate bucket by
      # this point. Copying 4 GB into GitHub's quota was what silently emptied
      # the v1.4 release; public/live R2 keys remain untouched here.

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: commercial-release
    permissions:
      contents: write   # softprops/action-gh-release creates the GitHub Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ env.CANDIDATE_RELEASE_TAG }}

      # ASSEMBLE SHA256SUMS FROM THE SIDECARS THE BUILD JOBS ALREADY WROTE.
      #
      # The ISOs are in R2 and are 2-4 GB; re-downloading them here to run
      # sha256sum would cost minutes and bandwidth to recompute a number each
      # build job already had in hand. Each edition wrote its own one-line
      # .sha256 to R2 instead, and this joins them.
      #
      # Free first, Pro second, so the file's line order is stable across
      # releases and a diff between two SHA256SUMS is readable.
      - name: Assemble SHA256SUMS from R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          R2_ACCOUNT: ${{ secrets.R2_ACCOUNT_ID }}
          STAGING_BUCKET: ${{ secrets.R2_STAGING_BUCKET }}
          CLOUDFLARE_R2_AUDIT_TOKEN: ${{ secrets.CLOUDFLARE_R2_AUDIT_TOKEN }}
        run: |
          set -e
          python3 tools/check-private-r2-staging.py \
            --account "$R2_ACCOUNT" --bucket "$STAGING_BUCKET"
          EP="https://${R2_ACCOUNT}.r2.cloudflarestorage.com"
          mkdir -p out rel
          VERSION=$(python3 -c \
            'import json; print(json.load(open("site/manifest/release.json"))["version"])')
          SOURCE_COMMIT=$(python3 -c \
            'import json; print(json.load(open("site/manifest/release.json"))["source"]["commit"])')
          PREFIX="staging/$CANDIDATE_RELEASE_TAG/$SOURCE_COMMIT"
          FREE_ISO="dagric-os-$VERSION-amd64.iso"
          PRO_ISO="dagric-os-pro-$VERSION-amd64.iso"
          FREE_MANIFEST="dagric-os-$VERSION.packages"
          PRO_MANIFEST="dagric-os-pro-$VERSION.packages"
          for f in "$FREE_ISO" "$PRO_ISO"; do
            aws s3 cp "s3://$STAGING_BUCKET/$PREFIX/checksums/$f.sha256" "out/$f.sha256" \
              --endpoint-url "$EP" --only-show-errors
          done
          for f in "$FREE_MANIFEST" "$PRO_MANIFEST"; do
            aws s3 cp "s3://$STAGING_BUCKET/$PREFIX/manifest/$f" "out/$f" \
              --endpoint-url "$EP" --only-show-errors
          done
          for edition in free pro; do
            aws s3 cp "s3://$STAGING_BUCKET/$PREFIX/manifest/PACKAGE_SECTIONS-$edition.tsv" \
              "out/PACKAGE_SECTIONS-$edition.tsv" \
              --endpoint-url "$EP" --only-show-errors
          done
          aws s3 cp \
            "s3://$STAGING_BUCKET/$PREFIX/manifest/COMMERCIAL-RELEASE-AUTHORIZATION.json" \
            out/COMMERCIAL-RELEASE-AUTHORIZATION.json \
            --endpoint-url "$EP" --only-show-errors
          cat "out/$FREE_ISO.sha256" "out/$PRO_ISO.sha256" > out/SHA256SUMS
          cat out/SHA256SUMS

      - name: Hard-gate release and promotion records
        env:
          COMMERCIAL_RELEASE_APPROVAL_JSON: ${{ secrets.COMMERCIAL_RELEASE_APPROVAL_JSON }}
          PHYSICAL_RELEASE_EVIDENCE_JSON: ${{ secrets.PHYSICAL_RELEASE_EVIDENCE_JSON }}
        run: |
          set -eu
          python3 tools/check-release-locales.py
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          fi
          VERSION=$(python3 -c \
            'import json; print(json.load(open("site/manifest/release.json"))["version"])')
          SOURCE_COMMIT=$(python3 -c \
            'import json; print(json.load(open("site/manifest/release.json"))["source"]["commit"])')
          PHYSICAL_OUTPUT=$(python3 tools/check-physical-release.py check \
            --candidate-commit "$SOURCE_COMMIT" \
            --release-tag "$CANDIDATE_RELEASE_TAG")
          printf '%s\n' "$PHYSICAL_OUTPUT"
          PHYSICAL_DIGEST=$(printf '%s\n' "$PHYSICAL_OUTPUT" | sed -n 's/.*evidence=\([0-9a-f]\{64\}\).*/\1/p')
          test -n "$PHYSICAL_DIGEST"
          SOURCE_INDEX=$(python3 -c \
            'import json,urllib.parse; print(urllib.parse.urlsplit(json.load(open("site/manifest/release.json"))["source_index"]["url"]).path.rsplit("/",1)[-1])')
          GATE_OUTPUT=$(python3 tools/check-commercial-release.py promotion \
            --checksums out/SHA256SUMS \
            --free-manifest "out/dagric-os-$VERSION.packages" \
            --pro-manifest "out/dagric-os-pro-$VERSION.packages" \
            --free-package-sections out/PACKAGE_SECTIONS-free.tsv \
            --pro-package-sections out/PACKAGE_SECTIONS-pro.tsv \
            --candidate-commit "$SOURCE_COMMIT" \
            --release-tag "$CANDIDATE_RELEASE_TAG")
          printf '%s\n' "$GATE_OUTPUT"
          APPROVAL_DIGEST=$(printf '%s\n' "$GATE_OUTPUT" | sed -n 's/.*approval=//p')
          test -n "$APPROVAL_DIGEST"
          APPROVAL_DIGEST="$APPROVAL_DIGEST" SOURCE_COMMIT="$SOURCE_COMMIT" \
            SOURCE_INDEX="$SOURCE_INDEX" VERSION="$VERSION" \
            python3 - <<'PY'
          import hashlib, json, os, pathlib

          def digest(path):
              return hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest()

          stamp = json.load(open("out/COMMERCIAL-RELEASE-AUTHORIZATION.json", encoding="utf-8"))
          release = json.load(open("site/manifest/release.json", encoding="utf-8"))
          assert stamp.get("schema") == "dagric-commercial-release-authorization-v1"
          assert stamp.get("release_tag") == os.environ["CANDIDATE_RELEASE_TAG"]
          assert stamp.get("candidate_commit") == os.environ["SOURCE_COMMIT"]
          assert stamp.get("approval_sha256") == os.environ["APPROVAL_DIGEST"]
          assert stamp.get("release_record_sha256") == digest("site/manifest/release.json")
          assert stamp.get("source_index_sha256") == digest(
              "site/manifest/" + os.environ["SOURCE_INDEX"]
          )
          assert stamp.get("checksums_sha256") == digest("out/SHA256SUMS")
          artifacts = {item["edition"]: item for item in release["artifacts"]}
          version = os.environ["VERSION"]
          for edition in ("free", "pro"):
              prefix = "dagric-os-pro" if edition == "pro" else "dagric-os"
              record = stamp["artifacts"][edition]
              expected = artifacts[edition]
              assert record["filename"] == expected["filename"]
              assert record["bytes"] == expected["bytes"]
              assert record["sha256"] == expected["sha256"]
              assert record["package_manifest_sha256"] == digest(
                  f"out/{prefix}-{version}.packages"
              )
              assert record["package_sections_sha256"] == digest(
                  f"out/PACKAGE_SECTIONS-{edition}.tsv"
              )
          PY
          mkdir -p rel
          cp out/SHA256SUMS \
             "out/dagric-os-$VERSION.packages" \
             "out/dagric-os-pro-$VERSION.packages" \
             out/PACKAGE_SECTIONS-free.tsv \
             out/PACKAGE_SECTIONS-pro.tsv \
             out/COMMERCIAL-RELEASE-AUTHORIZATION.json \
             site/manifest/release.json \
             "site/manifest/$SOURCE_INDEX" rel/
          printf '%s  COMMERCIAL_RELEASE_APPROVAL_JSON\n' "$APPROVAL_DIGEST" \
            > rel/COMMERCIAL-LEGAL-APPROVAL.sha256
          printf '%s  PHYSICAL_RELEASE_EVIDENCE_JSON\n' "$PHYSICAL_DIGEST" \
            > rel/PHYSICAL-RELEASE-EVIDENCE.sha256

      - name: Verify candidate-specific staged ISO identities
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          R2_ACCOUNT: ${{ secrets.R2_ACCOUNT_ID }}
          STAGING_BUCKET: ${{ secrets.R2_STAGING_BUCKET }}
        run: |
          set -eu
          EP="https://${R2_ACCOUNT}.r2.cloudflarestorage.com"
          VERSION=$(python3 -c \
            'import json; print(json.load(open("site/manifest/release.json"))["version"])')
          SOURCE_COMMIT=$(python3 -c \
            'import json; print(json.load(open("site/manifest/release.json"))["source"]["commit"])')
          PREFIX="staging/$CANDIDATE_RELEASE_TAG/$SOURCE_COMMIT"
          for EDITION in free pro; do
            if [ "$EDITION" = pro ]; then
              ISO="dagric-os-pro-$VERSION-amd64.iso"
            else
              ISO="dagric-os-$VERSION-amd64.iso"
            fi
            HEAD_JSON="out/$EDITION-r2-head.json"
            aws s3api head-object --bucket "$STAGING_BUCKET" --key "$PREFIX/$ISO" \
              --endpoint-url "$EP" > "$HEAD_JSON"
            EDITION="$EDITION" HEAD_JSON="$HEAD_JSON" \
              SOURCE_COMMIT="$SOURCE_COMMIT" RELEASE_TAG="$CANDIDATE_RELEASE_TAG" \
              python3 - <<'PY'
          import json, os
          release = json.load(open("site/manifest/release.json", encoding="utf-8"))
          head = json.load(open(os.environ["HEAD_JSON"], encoding="utf-8"))
          artifact = next(a for a in release["artifacts"] if a["edition"] == os.environ["EDITION"])
          metadata = {str(k).lower(): str(v) for k, v in head.get("Metadata", {}).items()}
          assert head.get("ContentLength") == artifact["bytes"], "staged ISO byte size differs"
          assert metadata.get("sha256") == artifact["sha256"], "staged ISO hash metadata differs"
          assert metadata.get("source-commit") == os.environ["SOURCE_COMMIT"], "staged ISO source differs"
          assert metadata.get("release-tag") == os.environ["RELEASE_TAG"], "staged ISO tag differs"
          PY
          done

      - name: Stage gated release records
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          R2_ACCOUNT: ${{ secrets.R2_ACCOUNT_ID }}
          STAGING_BUCKET: ${{ secrets.R2_STAGING_BUCKET }}
          CLOUDFLARE_R2_AUDIT_TOKEN: ${{ secrets.CLOUDFLARE_R2_AUDIT_TOKEN }}
        run: |
          set -eu
          python3 tools/check-private-r2-staging.py \
            --account "$R2_ACCOUNT" --bucket "$STAGING_BUCKET"
          EP="https://${R2_ACCOUNT}.r2.cloudflarestorage.com"
          VERSION=$(python3 -c \
            'import json; print(json.load(open("site/manifest/release.json"))["version"])')
          SOURCE_COMMIT=$(python3 -c \
            'import json; print(json.load(open("site/manifest/release.json"))["source"]["commit"])')
          PREFIX="staging/$CANDIDATE_RELEASE_TAG/$SOURCE_COMMIT"
          SOURCE_INDEX=$(python3 -c \
            'import json,urllib.parse; print(urllib.parse.urlsplit(json.load(open("site/manifest/release.json"))["source_index"]["url"]).path.rsplit("/",1)[-1])')
          # The live records still match the live ISOs and signature. Only the
          # candidate namespace changes here; public promotion stays manual.
          aws s3 cp out/SHA256SUMS "s3://$STAGING_BUCKET/$PREFIX/SHA256SUMS" \
            --endpoint-url "$EP" --only-show-errors
          aws s3 cp site/manifest/release.json \
            "s3://$STAGING_BUCKET/$PREFIX/manifest/release.json" \
            --endpoint-url "$EP" --only-show-errors
          aws s3 cp "site/manifest/$SOURCE_INDEX" \
            "s3://$STAGING_BUCKET/$PREFIX/manifest/$SOURCE_INDEX" \
            --endpoint-url "$EP" --only-show-errors
          aws s3 cp rel/COMMERCIAL-LEGAL-APPROVAL.sha256 \
            "s3://$STAGING_BUCKET/$PREFIX/manifest/COMMERCIAL-LEGAL-APPROVAL.sha256" \
            --endpoint-url "$EP" --only-show-errors
          aws s3 cp rel/PHYSICAL-RELEASE-EVIDENCE.sha256 \
            "s3://$STAGING_BUCKET/$PREFIX/manifest/PHYSICAL-RELEASE-EVIDENCE.sha256" \
            --endpoint-url "$EP" --only-show-errors
          {
            echo "### Legally gated candidate staged — NOT yet live"
            echo ""
            echo "New images are in a dedicated private R2 candidate bucket."
            echo "That bucket has no r2.dev access or custom domain, and neither"
            echo "the download page nor the live Free/Pro keys changed."
            echo ""
            echo '```'
            cat out/SHA256SUMS
            echo '```'
            echo ""
            echo "#### Promotion remains deliberately manual"
            echo ""
            echo "Sign SHA256SUMS offline, then use the audited local release"
            echo "procedure. Do not copy staging keys to live keys with raw AWS"
            echo "commands. tools/promote-r2-release.sh repeats the complete"
            echo "gate, verifies the offline signature and promotes it last."
          } >> "$GITHUB_STEP_SUMMARY"

      # THE SIGNATURE IS DELIBERATELY NOT MADE HERE.
      #
      # Signing in CI would mean putting the release private key into repository
      # secrets. That key has no passphrase and it signs the APT update channel
      # every installed machine already trusts — so a leak does not just forge an
      # ISO, it lets someone push a package to every customer, and it cannot be
      # revoked from machines in the field. Any workflow change, any third-party
      # action, or anyone with admin on the repo could read it out.
      #
      # The R2 keys above are a different risk entirely: scoped to two buckets,
      # rotatable in a minute, and the worst case is a swapped ISO — which is
      # exactly what the signature exists to catch. That asymmetry is the whole
      # reason the upload is automated and the signature is not.

      # A public GitHub release would announce checksums before the offline
      # signature and atomic R2 promotion exist. Create a draft only; publishing
      # it belongs to the same human-controlled, signature-last promotion.
      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
        with:
          files: rel/*
          tag_name: ${{ env.CANDIDATE_RELEASE_TAG }}
          draft: true
          body: |
            Dagric OS ${{ env.CANDIDATE_RELEASE_TAG }} commercial release candidate.

            This is a draft. Do not publish it until the checksums are signed
            offline, the staged R2 objects are promoted together, and the live
            download verification passes.

            After promotion, download the free edition from https://dagric.com/download
            and verify it against SHA256SUMS below. Write to USB with Rufus or Ventoy, boot
            (prefer the UEFI entry), try the live desktop, then Install Dagric
            OS. See GETTING-STARTED.md.

            Neither ISO is attached to this release: GitHub caps a release asset
            at 2 GB and both images are at or over it. They are served from the
            download page instead — free openly, Pro through the link on the
            post-purchase page. SHA256SUMS here is the record of what each should
            hash to, and SHA256SUMS.sig alongside it on the download site is what
            proves the file came from us.
          generate_release_notes: true
          # so CI cannot close that window itself.
          #
          # Publishing is therefore a separate, deliberate copy AFTER the new
          # SHA256SUMS has been signed. See the job summary for the two commands.
          for EDITION in free pro; do
            if [ "$EDITION" = pro ]; then
              ISO="dagric-os-pro-$VERSION-amd64.iso"
              MANIFEST="dagric-os-pro-$VERSION.packages"
            else
              ISO="dagric-os-$VERSION-amd64.iso"
              MANIFEST="dagric-os-$VERSION.packages"
            fi
            ISO_SHA=$(sha256sum "out/$ISO" | cut -d' ' -f1)
            SOURCE_COMMIT=$(cat "out/SOURCE_COMMIT-$EDITION")
            PREFIX="staging/$CANDIDATE_RELEASE_TAG/$SOURCE_COMMIT"
            echo "Uploading $ISO -> private candidate bucket $PREFIX/"
            aws s3 cp "out/$ISO" "s3://$STAGING_BUCKET/$PREFIX/$ISO" \
              --metadata "sha256=$ISO_SHA,source-commit=$SOURCE_COMMIT,release-tag=$CANDIDATE_RELEASE_TAG" \
              --endpoint-url "$EP" --only-show-errors
            ( cd out && sha256sum "$ISO" > "$ISO.sha256" )
            aws s3 cp "out/$ISO.sha256" "s3://$STAGING_BUCKET/$PREFIX/checksums/$ISO.sha256" \
              --endpoint-url "$EP" --only-show-errors
            aws s3 cp "out/$MANIFEST" "s3://$STAGING_BUCKET/$PREFIX/manifest/$MANIFEST" \
              --endpoint-url "$EP" --only-show-errors
            aws s3 cp "out/PACKAGE_SECTIONS-$EDITION.tsv" \
              "s3://$STAGING_BUCKET/$PREFIX/manifest/PACKAGE_SECTIONS-$EDITION.tsv" \
              --endpoint-url "$EP" --only-show-errors
            echo "### $EDITION gated and staged" >> "$GITHUB_STEP_SUMMARY"
            cat "out/$ISO.sha256" >> "$GITHUB_STEP_SUMMARY"
          done
          aws s3 cp out/COMMERCIAL-RELEASE-AUTHORIZATION.json \
            "s3://$STAGING_BUCKET/$PREFIX/manifest/COMMERCIAL-RELEASE-AUTHORIZATION.json" \
            --endpoint-url "$EP" --only-show-errors

      # NO ARTIFACT UPLOAD. Both ISOs are in a private R2 candidate bucket by
      # this point. Copying 4 GB into GitHub's quota was what silently emptied
      # the v1.4 release; public/live R2 keys remain untouched here.

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: commercial-release
    permissions:
      contents: write   # softprops/action-gh-release creates the GitHub Release
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ env.CANDIDATE_RELEASE_TAG }}

      # ASSEMBLE SHA256SUMS FROM THE SIDECARS THE BUILD JOBS ALREADY WROTE.
      #
      # The ISOs are in R2 and are 2-4 GB; re-downloading them here to run
      # sha256sum would cost minutes and bandwidth to recompute a number each
      # build job already had in hand. Each edition wrote its own one-line
      # .sha256 to R2 instead, and this joins them.
      #
      # Free first, Pro second, so the file's line order is stable across
      # releases and a diff between two SHA256SUMS is readable.
      - name: Assemble SHA256SUMS from R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          R2_ACCOUNT: ${{ secrets.R2_ACCOUNT_ID }}
          STAGING_BUCKET: ${{ secrets.R2_STAGING_BUCKET }}
          CLOUDFLARE_R2_AUDIT_TOKEN: ${{ secrets.CLOUDFLARE_R2_AUDIT_TOKEN }}
        run: |
          set -e
          python3 tools/check-private-r2-staging.py \
            --account "$R2_ACCOUNT" --bucket "$STAGING_BUCKET"
          EP="https://${R2_ACCOUNT}.r2.cloudflarestorage.com"
          mkdir -p out rel
          VERSION=$(python3 -c \
            'import json; print(json.load(open("site/manifest/release.json"))["version"])')
          SOURCE_COMMIT=$(python3 -c \
            'import json; print(json.load(open("site/manifest/release.json"))["source"]["commit"])')
          PREFIX="staging/$CANDIDATE_RELEASE_TAG/$SOURCE_COMMIT"
          FREE_ISO="dagric-os-$VERSION-amd64.iso"
          PRO_ISO="dagric-os-pro-$VERSION-amd64.iso"
          FREE_MANIFEST="dagric-os-$VERSION.packages"
          PRO_MANIFEST="dagric-os-pro-$VERSION.packages"
          for f in "$FREE_ISO" "$PRO_ISO"; do
            aws s3 cp "s3://$STAGING_BUCKET/$PREFIX/checksums/$f.sha256" "out/$f.sha256" \
              --endpoint-url "$EP" --only-show-errors
          done
          for f in "$FREE_MANIFEST" "$PRO_MANIFEST"; do
            aws s3 cp "s3://$STAGING_BUCKET/$PREFIX/manifest/$f" "out/$f" \
              --endpoint-url "$EP" --only-show-errors
          done
          for edition in free pro; do
            aws s3 cp "s3://$STAGING_BUCKET/$PREFIX/manifest/PACKAGE_SECTIONS-$edition.tsv" \
              "out/PACKAGE_SECTIONS-$edition.tsv" \
              --endpoint-url "$EP" --only-show-errors
          done
          aws s3 cp \
            "s3://$STAGING_BUCKET/$PREFIX/manifest/COMMERCIAL-RELEASE-AUTHORIZATION.json" \
            out/COMMERCIAL-RELEASE-AUTHORIZATION.json \
            --endpoint-url "$EP" --only-show-errors
          cat "out/$FREE_ISO.sha256" "out/$PRO_ISO.sha256" > out/SHA256SUMS
          cat out/SHA256SUMS

      - name: Hard-gate release and promotion records
        env:
          COMMERCIAL_RELEASE_APPROVAL_JSON: ${{ secrets.COMMERCIAL_RELEASE_APPROVAL_JSON }}
          PHYSICAL_RELEASE_EVIDENCE_JSON: ${{ secrets.PHYSICAL_RELEASE_EVIDENCE_JSON }}
        run: |
          set -eu
          python3 tools/check-release-locales.py
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          fi
          VERSION=$(python3 -c \
            'import json; print(json.load(open("site/manifest/release.json"))["version"])')
          SOURCE_COMMIT=$(python3 -c \
            'import json; print(json.load(open("site/manifest/release.json"))["source"]["commit"])')
          PHYSICAL_OUTPUT=$(python3 tools/check-physical-release.py check \
            --candidate-commit "$SOURCE_COMMIT" \
            --release-tag "$CANDIDATE_RELEASE_TAG")
          printf '%s\n' "$PHYSICAL_OUTPUT"
          PHYSICAL_DIGEST=$(printf '%s\n' "$PHYSICAL_OUTPUT" | sed -n 's/.*evidence=\([0-9a-f]\{64\}\).*/\1/p')
          test -n "$PHYSICAL_DIGEST"
          SOURCE_INDEX=$(python3 -c \
            'import json,urllib.parse; print(urllib.parse.urlsplit(json.load(open("site/manifest/release.json"))["source_index"]["url"]).path.rsplit("/",1)[-1])')
          GATE_OUTPUT=$(python3 tools/check-commercial-release.py promotion \
            --checksums out/SHA256SUMS \
            --free-manifest "out/dagric-os-$VERSION.packages" \
            --pro-manifest "out/dagric-os-pro-$VERSION.packages" \
            --free-package-sections out/PACKAGE_SECTIONS-free.tsv \
            --pro-package-sections out/PACKAGE_SECTIONS-pro.tsv \
            --candidate-commit "$SOURCE_COMMIT" \
            --release-tag "$CANDIDATE_RELEASE_TAG")
          printf '%s\n' "$GATE_OUTPUT"
          APPROVAL_DIGEST=$(printf '%s\n' "$GATE_OUTPUT" | sed -n 's/.*approval=//p')
          test -n "$APPROVAL_DIGEST"
          APPROVAL_DIGEST="$APPROVAL_DIGEST" SOURCE_COMMIT="$SOURCE_COMMIT" \
            SOURCE_INDEX="$SOURCE_INDEX" VERSION="$VERSION" \
            python3 - <<'PY'
          import hashlib, json, os, pathlib

          def digest(path):
              return hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest()

          stamp = json.load(open("out/COMMERCIAL-RELEASE-AUTHORIZATION.json", encoding="utf-8"))
          release = json.load(open("site/manifest/release.json", encoding="utf-8"))
          assert stamp.get("schema") == "dagric-commercial-release-authorization-v1"
          assert stamp.get("release_tag") == os.environ["CANDIDATE_RELEASE_TAG"]
          assert stamp.get("candidate_commit") == os.environ["SOURCE_COMMIT"]
          assert stamp.get("approval_sha256") == os.environ["APPROVAL_DIGEST"]
          assert stamp.get("release_record_sha256") == digest("site/manifest/release.json")
          assert stamp.get("source_index_sha256") == digest(
              "site/manifest/" + os.environ["SOURCE_INDEX"]
          )
          assert stamp.get("checksums_sha256") == digest("out/SHA256SUMS")
          artifacts = {item["edition"]: item for item in release["artifacts"]}
          version = os.environ["VERSION"]
          for edition in ("free", "pro"):
              prefix = "dagric-os-pro" if edition == "pro" else "dagric-os"
              record = stamp["artifacts"][edition]
              expected = artifacts[edition]
              assert record["filename"] == expected["filename"]
              assert record["bytes"] == expected["bytes"]
              assert record["sha256"] == expected["sha256"]
              assert record["package_manifest_sha256"] == digest(
                  f"out/{prefix}-{version}.packages"
              )
              assert record["package_sections_sha256"] == digest(
                  f"out/PACKAGE_SECTIONS-{edition}.tsv"
              )
          PY
          mkdir -p rel
          cp out/SHA256SUMS \
             "out/dagric-os-$VERSION.packages" \
             "out/dagric-os-pro-$VERSION.packages" \
             out/PACKAGE_SECTIONS-free.tsv \
             out/PACKAGE_SECTIONS-pro.tsv \
             out/COMMERCIAL-RELEASE-AUTHORIZATION.json \
             site/manifest/release.json \
             "site/manifest/$SOURCE_INDEX" rel/
          printf '%s  COMMERCIAL_RELEASE_APPROVAL_JSON\n' "$APPROVAL_DIGEST" \
            > rel/COMMERCIAL-LEGAL-APPROVAL.sha256
          printf '%s  PHYSICAL_RELEASE_EVIDENCE_JSON\n' "$PHYSICAL_DIGEST" \
            > rel/PHYSICAL-RELEASE-EVIDENCE.sha256

      - name: Verify candidate-specific staged ISO identities
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          R2_ACCOUNT: ${{ secrets.R2_ACCOUNT_ID }}
          STAGING_BUCKET: ${{ secrets.R2_STAGING_BUCKET }}
        run: |
          set -eu
          EP="https://${R2_ACCOUNT}.r2.cloudflarestorage.com"
          VERSION=$(python3 -c \
            'import json; print(json.load(open("site/manifest/release.json"))["version"])')
          SOURCE_COMMIT=$(python3 -c \
            'import json; print(json.load(open("site/manifest/release.json"))["source"]["commit"])')
          PREFIX="staging/$CANDIDATE_RELEASE_TAG/$SOURCE_COMMIT"
          for EDITION in free pro; do
            if [ "$EDITION" = pro ]; then
              ISO="dagric-os-pro-$VERSION-amd64.iso"
            else
              ISO="dagric-os-$VERSION-amd64.iso"
            fi
            HEAD_JSON="out/$EDITION-r2-head.json"
            aws s3api head-object --bucket "$STAGING_BUCKET" --key "$PREFIX/$ISO" \
              --endpoint-url "$EP" > "$HEAD_JSON"
            EDITION="$EDITION" HEAD_JSON="$HEAD_JSON" \
              SOURCE_COMMIT="$SOURCE_COMMIT" RELEASE_TAG="$CANDIDATE_RELEASE_TAG" \
              python3 - <<'PY'
          import json, os
          release = json.load(open("site/manifest/release.json", encoding="utf-8"))
          head = json.load(open(os.environ["HEAD_JSON"], encoding="utf-8"))
          artifact = next(a for a in release["artifacts"] if a["edition"] == os.environ["EDITION"])
          metadata = {str(k).lower(): str(v) for k, v in head.get("Metadata", {}).items()}
          assert head.get("ContentLength") == artifact["bytes"], "staged ISO byte size differs"
          assert metadata.get("sha256") == artifact["sha256"], "staged ISO hash metadata differs"
          assert metadata.get("source-commit") == os.environ["SOURCE_COMMIT"], "staged ISO source differs"
          assert metadata.get("release-tag") == os.environ["RELEASE_TAG"], "staged ISO tag differs"
          PY
          done

      - name: Stage gated release records
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          R2_ACCOUNT: ${{ secrets.R2_ACCOUNT_ID }}
          STAGING_BUCKET: ${{ secrets.R2_STAGING_BUCKET }}
          CLOUDFLARE_R2_AUDIT_TOKEN: ${{ secrets.CLOUDFLARE_R2_AUDIT_TOKEN }}
        run: |
          set -eu
          python3 tools/check-private-r2-staging.py \
            --account "$R2_ACCOUNT" --bucket "$STAGING_BUCKET"
          EP="https://${R2_ACCOUNT}.r2.cloudflarestorage.com"
          VERSION=$(python3 -c \
            'import json; print(json.load(open("site/manifest/release.json"))["version"])')
          SOURCE_COMMIT=$(python3 -c \
            'import json; print(json.load(open("site/manifest/release.json"))["source"]["commit"])')
          PREFIX="staging/$CANDIDATE_RELEASE_TAG/$SOURCE_COMMIT"
          SOURCE_INDEX=$(python3 -c \
            'import json,urllib.parse; print(urllib.parse.urlsplit(json.load(open("site/manifest/release.json"))["source_index"]["url"]).path.rsplit("/",1)[-1])')
          # The live records still match the live ISOs and signature. Only the
          # candidate namespace changes here; public promotion stays manual.
          aws s3 cp out/SHA256SUMS "s3://$STAGING_BUCKET/$PREFIX/SHA256SUMS" \
            --endpoint-url "$EP" --only-show-errors
          aws s3 cp site/manifest/release.json \
            "s3://$STAGING_BUCKET/$PREFIX/manifest/release.json" \
            --endpoint-url "$EP" --only-show-errors
          aws s3 cp "site/manifest/$SOURCE_INDEX" \
            "s3://$STAGING_BUCKET/$PREFIX/manifest/$SOURCE_INDEX" \
            --endpoint-url "$EP" --only-show-errors
          aws s3 cp rel/COMMERCIAL-LEGAL-APPROVAL.sha256 \
            "s3://$STAGING_BUCKET/$PREFIX/manifest/COMMERCIAL-LEGAL-APPROVAL.sha256" \
            --endpoint-url "$EP" --only-show-errors
          aws s3 cp rel/PHYSICAL-RELEASE-EVIDENCE.sha256 \
            "s3://$STAGING_BUCKET/$PREFIX/manifest/PHYSICAL-RELEASE-EVIDENCE.sha256" \
            --endpoint-url "$EP" --only-show-errors
          {
            echo "### Legally gated candidate staged — NOT yet live"
            echo ""
            echo "New images are in a dedicated private R2 candidate bucket."
            echo "That bucket has no r2.dev access or custom domain, and neither"
            echo "the download page nor the live Free/Pro keys changed."
            echo ""
            echo '```'
            cat out/SHA256SUMS
            echo '```'
            echo ""
            echo "#### Promotion remains deliberately manual"
            echo ""
            echo "Sign SHA256SUMS offline, then use the audited local release"
            echo "procedure. Do not copy staging keys to live keys with raw AWS"
            echo "commands. tools/promote-r2-release.sh repeats the complete"
            echo "gate, verifies the offline signature and promotes it last."
          } >> "$GITHUB_STEP_SUMMARY"

      # THE SIGNATURE IS DELIBERATELY NOT MADE HERE.
      #
      # Signing in CI would mean putting the release private key into repository
      # secrets. That key has no passphrase and it signs the APT update channel
      # every installed machine already trusts — so a leak does not just forge an
      # ISO, it lets someone push a package to every customer, and it cannot be
      # revoked from machines in the field. Any workflow change, any third-party
      # action, or anyone with admin on the repo could read it out.
      #
      # The R2 keys above are a different risk entirely: scoped to two buckets,
      # rotatable in a minute, and the worst case is a swapped ISO — which is
      # exactly what the signature exists to catch. That asymmetry is the whole
      # reason the upload is automated and the signature is not.

      # A public GitHub release would announce checksums before the offline
      # signature and atomic R2 promotion exist. Create a draft only; publishing
      # it belongs to the same human-controlled, signature-last promotion.
      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
        with:
          files: rel/*
          tag_name: ${{ env.CANDIDATE_RELEASE_TAG }}
          draft: true
          body: |
            Dagric OS ${{ env.CANDIDATE_RELEASE_TAG }} commercial release candidate.

            This is a draft. Do not publish it until the checksums are signed
            offline, the staged R2 objects are promoted together, and the live
            download verification passes.

            After promotion, download the free edition from https://dagric.com/download
            and verify it against SHA256SUMS below. Write to USB with Rufus or Ventoy, boot
            (prefer the UEFI entry), try the live desktop, then Install Dagric
            OS. See GETTING-STARTED.md.

            Neither ISO is attached to this release: GitHub caps a release asset
            at 2 GB and both images are at or over it. They are served from the
            download page instead — free openly, Pro through the link on the
            post-purchase page. SHA256SUMS here is the record of what each should
            hash to, and SHA256SUMS.sig alongside it on the download site is what
            proves the file came from us.
          generate_release_notes: true
