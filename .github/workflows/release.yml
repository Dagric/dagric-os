# Dagric OS — automated release. Push a version tag (e.g. v1.2) and this
# builds BOTH editions, checksums them, and publishes a GitHub Release with
# the ISOs attached. Turns a release into a single `git tag && git push`.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # needed to create the Release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      matrix:
        edition: [free, pro]
    steps:
      - uses: actions/checkout@v4

      - name: Build ${{ matrix.edition }} ISO
        run: |
          docker build -t dagric-builder docker/
          mkdir -p out
          docker run --rm --privileged \
            -e EDITION=${{ matrix.edition }} \
            -v "$PWD:/src:ro" -v "$PWD/out:/out" \
            dagric-builder sh /src/docker/container-build.sh

      - name: Name the ISO per edition
        run: |
          VER="${GITHUB_REF_NAME#v}"
          if [ "${{ matrix.edition }}" = "pro" ]; then
            mv out/*.iso "out/dagric-os-pro-${VER}-amd64.iso"
          else
            mv out/*.iso "out/dagric-os-${VER}-amd64.iso"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: iso-${{ matrix.edition }}
          path: out/dagric-os-*.iso
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dl
      - name: Collect + checksum
        run: |
          mkdir -p out
          find dl -name '*.iso' -exec mv {} out/ \;
          cd out && sha256sum *.iso > SHA256SUMS && cat SHA256SUMS

      # GitHub Releases reject any single asset over 2 GB. The free ISO is
      # ~2.0 GB and sits right on that line; Pro is ~3.9 GB and cannot ever be
      # attached. This step used to hand `out/*.iso` to the release action and
      # let it fail on Pro AFTER a successful two-hour build — the worst place
      # to discover a hard platform limit.
      #
      # So the ISOs are separated from the things that verify them. SHA256SUMS
      # is a few hundred bytes and is what a buyer actually needs from the
      # release page: it is the signed record of what the ISOs should hash to,
      # and it publishes even when the images themselves cannot.
      #
      # The ISOs stay as workflow artifacts, which have no 2 GB per-file cap,
      # and get uploaded to R2 for distribution — that is where the download
      # page already points. Nothing about the release is silently incomplete;
      # the notes say where the images are.
      - name: Sort assets by what a Release can actually hold
        run: |
          mkdir -p rel big
          cp out/SHA256SUMS rel/
          for f in out/*.iso; do
            [ -f "$f" ] || continue
            sz=$(stat -c%s "$f")
            if [ "$sz" -lt 2000000000 ]; then
              cp "$f" rel/
              echo "release-attachable: $(basename "$f") ($sz bytes)"
            else
              mv "$f" big/
              echo "TOO LARGE for a Release, artifact only: $(basename "$f") ($sz bytes)"
            fi
          done

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: rel/*
          body: |
            Dagric OS ${{ github.ref_name }}.

            Verify downloads against SHA256SUMS. Write to USB with Rufus or
            Ventoy, boot (prefer the UEFI entry), try the live desktop, then
            Install Dagric OS. See GETTING-STARTED.md.

            The Pro ISO is not attached here — GitHub caps a release asset at
            2 GB and Pro is larger. Buyers download it from the link on their
            post-purchase page; the checksum above covers it either way.
          generate_release_notes: true
