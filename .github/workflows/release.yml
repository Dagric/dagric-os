# Dagric OS — automated release. Push a version tag (e.g. v1.2) and this
# builds BOTH editions, checksums them, and publishes a GitHub Release with
# the ISOs attached. Turns a release into a single `git tag && git push`.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # needed to create the Release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      # The two editions are independent, so one failing must not cancel the
      # other. It already did: a run where free's UPLOAD hit the artifact quota
      # reported "build (pro): cancelled" — a Pro build twenty-nine minutes in,
      # killed by an unrelated storage problem in the other job, and no way to
      # know whether it would have succeeded.
      fail-fast: false
      matrix:
        edition: [free, pro]
    steps:
      - uses: actions/checkout@v4

      # THE PRO BUILD RAN OUT OF DISK, AND ONLY THE PRO BUILD.
      #
      # ubuntu-latest gives roughly 14 GB free on /. Free fits and produced a
      # 2.1 GB ISO; Pro does not — i386 multiarch, wine32, the full LibreOffice,
      # Blender and OBS make a much larger chroot, and it died compressing the
      # initramfs:
      #
      #     zstd: error 70 : Write error : cannot write block : No space left
      #     E: mkinitramfs failure zstd -q -9 70
      #
      # which surfaced as "0700-plymouth.hook.chroot failed" — a hook that was
      # working perfectly and simply had nowhere to write.
      #
      # The runner ships ~30 GB of toolchains a Debian live-build never touches:
      # .NET, the Android SDK, GHC, Swift, PowerShell, the hosted tool cache.
      # Removing them costs seconds and roughly triples the space available.
      # Printed before and after so a future disk failure is one glance away
      # rather than four hundred lines into a log.
      - name: Reclaim runner disk
        run: |
          echo "before:"; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/share/swift \
                      /usr/local/share/powershell "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          echo "after:"; df -h / | tail -1

      - name: Build ${{ matrix.edition }} ISO
        run: |
          docker build -t dagric-builder docker/
          mkdir -p out
          docker run --rm --privileged \
            -e EDITION=${{ matrix.edition }} \
            -v "$PWD:/src:ro" -v "$PWD/out:/out" \
            dagric-builder sh /src/docker/container-build.sh

      - name: Name the ISO per edition
        run: |
          VER="${GITHUB_REF_NAME#v}"
          if [ "${{ matrix.edition }}" = "pro" ]; then
            mv out/*.iso "out/dagric-os-pro-${VER}-amd64.iso"
          else
            mv out/*.iso "out/dagric-os-${VER}-amd64.iso"
          fi

      # THE UPLOAD MUST NOT DECIDE WHETHER THE BUILD PASSED.
      #
      # Four days of red X's on this repo were successful builds whose artifact
      # upload hit the storage quota. A red X looks identical either way, so the
      # one working build environment appeared broken while a laptop with a dead
      # WSL was being coaxed for hours. The ISO had been built correctly every
      # single time and thrown away.
      #
      # continue-on-error means a storage problem is reported as a storage
      # problem — the step goes yellow, the job stays green, and the build
      # result answers the question it was actually asked: does the tree still
      # build? A genuine build failure still fails, because it happens earlier
      # and this step never runs.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: iso-${{ matrix.edition }}
          path: out/dagric-os-*.iso
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dl
      - name: Collect + checksum
        run: |
          mkdir -p out
          find dl -name '*.iso' -exec mv {} out/ \;
          cd out && sha256sum *.iso > SHA256SUMS && cat SHA256SUMS

      # GitHub Releases reject any single asset over 2 GB. The free ISO is
      # ~2.0 GB and sits right on that line; Pro is ~3.9 GB and cannot ever be
      # attached. This step used to hand `out/*.iso` to the release action and
      # let it fail on Pro AFTER a successful two-hour build — the worst place
      # to discover a hard platform limit.
      #
      # So the ISOs are separated from the things that verify them. SHA256SUMS
      # is a few hundred bytes and is what a buyer actually needs from the
      # release page: it is the signed record of what the ISOs should hash to,
      # and it publishes even when the images themselves cannot.
      #
      # The ISOs stay as workflow artifacts, which have no 2 GB per-file cap,
      # and get uploaded to R2 for distribution — that is where the download
      # page already points. Nothing about the release is silently incomplete;
      # the notes say where the images are.
      - name: Sort assets by what a Release can actually hold
        run: |
          mkdir -p rel big
          cp out/SHA256SUMS rel/
          for f in out/*.iso; do
            [ -f "$f" ] || continue
            sz=$(stat -c%s "$f")
            if [ "$sz" -lt 2000000000 ]; then
              cp "$f" rel/
              echo "release-attachable: $(basename "$f") ($sz bytes)"
            else
              mv "$f" big/
              echo "TOO LARGE for a Release, artifact only: $(basename "$f") ($sz bytes)"
            fi
          done

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: rel/*
          body: |
            Dagric OS ${{ github.ref_name }}.

            Verify downloads against SHA256SUMS. Write to USB with Rufus or
            Ventoy, boot (prefer the UEFI entry), try the live desktop, then
            Install Dagric OS. See GETTING-STARTED.md.

            The Pro ISO is not attached here — GitHub caps a release asset at
            2 GB and Pro is larger. Buyers download it from the link on their
            post-purchase page; the checksum above covers it either way.
          generate_release_notes: true
