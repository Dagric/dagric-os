# Dagric OS — automated release. Push a version tag (e.g. v1.2) and this
# builds BOTH editions, checksums them, and publishes a GitHub Release with
# the ISOs attached. Turns a release into a single `git tag && git push`.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # needed to create the Release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      # The two editions are independent, so one failing must not cancel the
      # other. It already did: a run where free's UPLOAD hit the artifact quota
      # reported "build (pro): cancelled" — a Pro build twenty-nine minutes in,
      # killed by an unrelated storage problem in the other job, and no way to
      # know whether it would have succeeded.
      fail-fast: false
      matrix:
        edition: [free, pro]
    steps:
      - uses: actions/checkout@v4

      # THE PRO BUILD RAN OUT OF DISK, AND ONLY THE PRO BUILD.
      #
      # ubuntu-latest gives roughly 14 GB free on /. Free fits and produced a
      # 2.1 GB ISO; Pro does not — i386 multiarch, wine32, the full LibreOffice,
      # Blender and OBS make a much larger chroot, and it died compressing the
      # initramfs:
      #
      #     zstd: error 70 : Write error : cannot write block : No space left
      #     E: mkinitramfs failure zstd -q -9 70
      #
      # which surfaced as "0700-plymouth.hook.chroot failed" — a hook that was
      # working perfectly and simply had nowhere to write.
      #
      # The runner ships ~30 GB of toolchains a Debian live-build never touches:
      # .NET, the Android SDK, GHC, Swift, PowerShell, the hosted tool cache.
      # Removing them costs seconds and roughly triples the space available.
      # Printed before and after so a future disk failure is one glance away
      # rather than four hundred lines into a log.
      - name: Reclaim runner disk
        run: |
          echo "before:"; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/share/swift \
                      /usr/local/share/powershell "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          echo "after:"; df -h / | tail -1

      - name: Build ${{ matrix.edition }} ISO
        run: |
          docker build -t dagric-builder docker/
          mkdir -p out
          docker run --rm --privileged \
            -e EDITION=${{ matrix.edition }} \
            -v "$PWD:/src:ro" -v "$PWD/out:/out" \
            dagric-builder sh /src/docker/container-build.sh

      # THE ISO FILENAME IS THE PRODUCT VERSION, NOT THE TAG, and that is not a
      # detail — it is a live link.
      #
      # This used to name the image from the tag (dagric-os-1.4-amd64.iso for
      # v1.4). site/download.html links to dagric-os-1.0-amd64.iso and the signed
      # SHA256SUMS covers that same name, so a tag-named upload would have left
      # the download button pointing at an object that does not exist. The
      # product version is "1.0 (Foundation)" in os-release and stays there; the
      # v1.x tags are release milestones, not user-facing version bumps.
      #
      # Overwriting the same key on each release is deliberate: the download URL
      # is stable and printed on the site, and the signature is what tells a
      # buyer which build they have.
      # The naming moved INTO container-build.sh, which now derives the ISO
      # name from $EDITION instead of handing back live-build's own
      # live-image-amd64.hybrid.iso for both editions. Left as `mv out/*.iso
      # "out/dagric-os-...iso"` this became a same-file mv the moment that
      # landed — GNU mv reports "are the same file" and exits 1, which would
      # fail the release job on a build that had just succeeded. So this step
      # checks the name instead of setting it, and still stops the release if
      # the ISO is not the one the R2 upload below is about to ask for.
      - name: Check the ISO name per edition
        run: |
          if [ "${{ matrix.edition }}" = "pro" ]; then
            WANT="out/dagric-os-pro-1.0-amd64.iso"
          else
            WANT="out/dagric-os-1.0-amd64.iso"
          fi
          if [ ! -f "$WANT" ]; then
            echo "::error::expected $WANT — container-build.sh produced:"
            ls -l out/
            exit 1
          fi
          ls -lh out/*.iso

      # UPLOAD STRAIGHT TO R2 INSTEAD OF THROUGH ARTIFACTS.
      #
      # v1.4 built both editions perfectly and then threw them away:
      #     Failed to CreateArtifact: Artifact storage quota has been hit.
      # The build step is continue-on-error (correctly — a storage problem is not
      # a build failure), so the jobs went green, the publish job found zero
      # artifacts, and the release produced nothing. A ~2 GB free ISO and a
      # ~3.9 GB Pro ISO will not fit an artifact quota on any plan this project
      # is on, so the round trip through artifacts can never work here.
      #
      # R2 is where the download page already points, so uploading directly is
      # both the fix and one fewer copy of a 4 GB file.
      #
      # AWS_REQUEST_CHECKSUM_CALCULATION: newer aws-cli v2 adds integrity headers
      # that R2's S3 layer rejects; "when_required" keeps it to what R2 accepts.
      - name: Upload ISO to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          R2_ACCOUNT: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          set -e
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$R2_ACCOUNT" ]; then
            echo "::error::R2 secrets are not configured. Add R2_ACCOUNT_ID,"
            echo "::error::R2_ACCESS_KEY_ID and R2_SECRET_ACCESS_KEY to the repo secrets."
            exit 1
          fi
          EP="https://${R2_ACCOUNT}.r2.cloudflarestorage.com"
          if [ "${{ matrix.edition }}" = "pro" ]; then
            ISO="dagric-os-pro-1.0-amd64.iso"; BUCKET="dagric-pro"
          else
            ISO="dagric-os-1.0-amd64.iso";     BUCKET="dagric-downloads"
          fi
          # STAGING, NOT THE LIVE KEY. This is the whole safety of the release.
          #
          # The live objects are what dagric.com/download serves right now, and
          # SHA256SUMS.sig beside them signs THOSE bytes. Overwriting the ISO and
          # SHA256SUMS here while that old signature is still in place would make
          # `gpg --verify` fail for every visitor — not "unsigned", but BAD
          # SIGNATURE, which reads as a tampered download and is worse than
          # shipping nothing. The signature is produced by hand, off this runner,
          # so CI cannot close that window itself.
          #
          # Publishing is therefore a separate, deliberate copy AFTER the new
          # SHA256SUMS has been signed. See the job summary for the two commands.
          echo "Uploading $ISO -> s3://$BUCKET/staging/"
          aws s3 cp "out/$ISO" "s3://$BUCKET/staging/$ISO" --endpoint-url "$EP" --only-show-errors
          # A per-edition checksum sidecar, so the publish job can assemble
          # SHA256SUMS without re-downloading gigabytes it already hashed here.
          ( cd out && sha256sum "$ISO" > "$ISO.sha256" )
          aws s3 cp "out/$ISO.sha256" "s3://dagric-downloads/staging/checksums/$ISO.sha256" \
            --endpoint-url "$EP" --only-show-errors
          echo "### ${{ matrix.edition }} uploaded" >> "$GITHUB_STEP_SUMMARY"
          cat "out/$ISO.sha256" >> "$GITHUB_STEP_SUMMARY"

      # NO ARTIFACT UPLOAD. The ISOs are already in R2 by this point, which is
      # where they are actually served from. Copying 4 GB into a quota that
      # cannot hold it was what silently emptied the v1.4 release.

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # ASSEMBLE SHA256SUMS FROM THE SIDECARS THE BUILD JOBS ALREADY WROTE.
      #
      # The ISOs are in R2 and are 2-4 GB; re-downloading them here to run
      # sha256sum would cost minutes and bandwidth to recompute a number each
      # build job already had in hand. Each edition wrote its own one-line
      # .sha256 to R2 instead, and this joins them.
      #
      # Free first, Pro second, so the file's line order is stable across
      # releases and a diff between two SHA256SUMS is readable.
      - name: Assemble SHA256SUMS from R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          R2_ACCOUNT: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          set -e
          EP="https://${R2_ACCOUNT}.r2.cloudflarestorage.com"
          mkdir -p out rel
          for f in dagric-os-1.0-amd64.iso dagric-os-pro-1.0-amd64.iso; do
            aws s3 cp "s3://dagric-downloads/staging/checksums/$f.sha256" "out/$f.sha256" \
              --endpoint-url "$EP" --only-show-errors
          done
          cat out/dagric-os-1.0-amd64.iso.sha256 \
              out/dagric-os-pro-1.0-amd64.iso.sha256 > out/SHA256SUMS
          cat out/SHA256SUMS
          cp out/SHA256SUMS rel/
          # Staging again — the live SHA256SUMS still matches the live ISOs and
          # its signature, and those three only ever move together.
          aws s3 cp out/SHA256SUMS s3://dagric-downloads/staging/SHA256SUMS \
            --endpoint-url "$EP" --only-show-errors
          {
            echo "### Built and staged — NOT yet live"
            echo ""
            echo "New images are in \`staging/\` on R2. The download page still"
            echo "serves the previous release, which is correct: its signature"
            echo "still matches it. Nothing customers see has changed."
            echo ""
            echo '```'
            cat out/SHA256SUMS
            echo '```'
            echo ""
            echo "#### To publish, sign first, then promote"
            echo ""
            echo "1. Sign the new checksums locally (the private key must never"
            echo "   be in CI — it signs the APT channel every machine trusts):"
            echo '```bash'
            echo "aws s3 cp s3://dagric-downloads/staging/SHA256SUMS . --endpoint-url \$EP"
            echo "gpg --detach-sign --armor -o SHA256SUMS.sig SHA256SUMS"
            echo '```'
            echo "2. Promote images and checksums together, signature last:"
            echo '```bash'
            echo "aws s3 cp s3://dagric-downloads/staging/dagric-os-1.0-amd64.iso s3://dagric-downloads/dagric-os-1.0-amd64.iso --endpoint-url \$EP"
            echo "aws s3 cp s3://dagric-pro/staging/dagric-os-pro-1.0-amd64.iso s3://dagric-pro/dagric-os-pro-1.0-amd64.iso --endpoint-url \$EP"
            echo "aws s3 cp SHA256SUMS     s3://dagric-downloads/SHA256SUMS     --endpoint-url \$EP"
            echo "aws s3 cp SHA256SUMS.sig s3://dagric-downloads/SHA256SUMS.sig --endpoint-url \$EP"
            echo '```'
            echo "Order matters: an ISO live against an older signature reads as"
            echo "a tampered download, which is worse than an older release."
          } >> "$GITHUB_STEP_SUMMARY"

      # THE SIGNATURE IS DELIBERATELY NOT MADE HERE.
      #
      # Signing in CI would mean putting the release private key into repository
      # secrets. That key has no passphrase and it signs the APT update channel
      # every installed machine already trusts — so a leak does not just forge an
      # ISO, it lets someone push a package to every customer, and it cannot be
      # revoked from machines in the field. Any workflow change, any third-party
      # action, or anyone with admin on the repo could read it out.
      #
      # The R2 keys above are a different risk entirely: scoped to two buckets,
      # rotatable in a minute, and the worst case is a swapped ISO — which is
      # exactly what the signature exists to catch. That asymmetry is the whole
      # reason the upload is automated and the signature is not.

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: rel/*
          body: |
            Dagric OS ${{ github.ref_name }}.

            Download the free edition from https://dagric.com/download and verify
            it against SHA256SUMS below. Write to USB with Rufus or Ventoy, boot
            (prefer the UEFI entry), try the live desktop, then Install Dagric
            OS. See GETTING-STARTED.md.

            Neither ISO is attached to this release: GitHub caps a release asset
            at 2 GB and both images are at or over it. They are served from the
            download page instead — free openly, Pro through the link on the
            post-purchase page. SHA256SUMS here is the record of what each should
            hash to, and SHA256SUMS.sig alongside it on the download site is what
            proves the file came from us.
          generate_release_notes: true
